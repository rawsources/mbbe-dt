<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>MBBE Discipleship</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column; sticky top bar, fixed bottom tab bar; lesson pages read like the booklet. */
:root {
  --bg: #f2f4ef; --surface: #ffffff; --raise: #f7f9f5; --ink: #1e2620; --muted: #5b685e; --line: #d4dbd2;
  --accent: #2f5d3a; --accent-ink: #ffffff; --accent-soft: #e3ebe1; --blank: #eef2eb;
  --ok: #2c7a4b; --warn: #a86a12; --miss: #b4532e; --info: #2f5f86; --scrim: rgba(20, 28, 22, .45);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Manrope", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121713; --surface: #1a211c; --raise: #1f2721; --ink: #e5ebe4; --muted: #9ba99e; --line: #2d372f;
  --accent: #8cc29a; --accent-ink: #10180f; --accent-soft: #223026; --blank: #202a22;
  --ok: #7fcb98; --warn: #e2b05a; --miss: #e8956f; --info: #8fb9df; --scrim: rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121713; --surface: #1a211c; --raise: #1f2721; --ink: #e5ebe4; --muted: #9ba99e; --line: #2d372f;
  --accent: #8cc29a; --accent-ink: #10180f; --accent-soft: #223026; --blank: #202a22;
  --ok: #7fcb98; --warn: #e2b05a; --miss: #e8956f; --info: #8fb9df; --scrim: rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
a { color: var(--accent) }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 36px }
.top h1 { font-family: var(--serif); font-size: 19px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700 }
.back { border: 0; background: var(--blank); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; flex: none }
.who { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; flex: none; max-width: 45% }
.who b { display: block; color: var(--ink); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

/* page */
.page { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px }
.page.nonav { padding-block-end: 48px }
h2 { font-family: var(--serif); font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance }
h3 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; font-weight: 700 }
p { margin: 0 }
.muted { color: var(--muted) }
.small { font-size: 13px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.stack { display: grid; gap: 10px }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0 }
.card.hero { background: var(--accent-soft); border-color: transparent }
a.card, button.card { text-decoration: none; color: inherit; text-align: left; cursor: pointer; width: 100% }
a.card:hover, button.card:hover { border-color: var(--accent) }
.list { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; cursor: pointer; text-align: left; width: 100% }
.item:hover { border-color: var(--accent) }
.item .t { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.item .s { grid-column: 1 / -1; font-size: 13px; color: var(--muted) }
.lesson-item .num { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.lesson-item .t { font-family: var(--serif); font-size: 17px }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--blank); color: var(--muted); white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent) }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent) }
.pill.miss { color: var(--miss); background: color-mix(in srgb, var(--miss) 14%, transparent) }
.pill.info { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent) }
.pill.plain::before { display: none }

.track { height: 8px; background: var(--blank); border-radius: 99px; overflow: hidden }
.fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 2px }
.tile:hover { border-color: var(--accent) }
.tile b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; font-family: var(--serif) }
.tile span { font-size: 12.5px; color: var(--muted); font-weight: 600 }
.tile.alert b { color: var(--warn) }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--miss); border-color: color-mix(in srgb, var(--miss) 45%, transparent) }
.btn.quiet { border-color: transparent; background: none; color: var(--muted) }
.btn.block { width: 100% }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px }
.btn[disabled] { opacity: .5; cursor: not-allowed }

form { display: grid; gap: 12px }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--muted) }
input.i, select.i, textarea.i { width: 100%; font-size: 16px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px }
textarea.i { min-height: 110px; resize: vertical; line-height: 1.45 }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; min-height: 180px }
input.i:focus, select.i:focus, textarea.i:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.err { color: var(--miss); font-weight: 600; font-size: 14px }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.chip .n { opacity: .75; margin-left: 4px }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--raise); position: sticky; top: 0 }
tr:last-child td { border-bottom: 0 }
td.num, th.num { text-align: right }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--raise) }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.nav-in { max-width: 760px; margin: 0 auto; display: flex; height: var(--nav-h) }
.nav a { flex: 1; display: grid; place-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; border-radius: 10px; position: relative }
.nav a svg { width: 22px; height: 22px }
.nav a[aria-current="page"] { color: var(--accent) }
.nav a[aria-current="page"]::after { content: ""; position: absolute; top: 2px; width: 26px; height: 3px; border-radius: 3px; background: var(--accent) }
.badge { position: absolute; top: 4px; left: 54%; background: var(--warn); color: #fff; font-size: 10px; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2) }
.demo { background: color-mix(in srgb, var(--info) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--info) 35%, transparent); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; display: grid; gap: 10px }
.demo b { color: var(--info) }
.loading { padding: 40px 0; text-align: center; color: var(--muted) }

/* auth */
.auth { min-height: 100%; display: grid; align-content: start; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 40px }
.auth-in { width: 100%; max-width: 420px; margin: 0 auto; display: grid; gap: 18px }
.brand .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent) }
.brand h1 { font-family: var(--serif); font-size: 34px; line-height: 1.1; margin: 6px 0 4px; font-weight: 700 }

/* lesson reader */
.reader { font-family: var(--serif); font-size: 17px; line-height: 1.65; display: grid; gap: 22px }
.reader .eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent) }
.reader h2.lt { font-size: clamp(26px, 6.5vw, 34px); line-height: 1.15; margin-top: 4px }
.memory { margin: 0; padding: 16px 18px; background: var(--accent-soft); border-radius: 14px; font-style: italic; font-size: 18px; line-height: 1.5 }
.memory .ref { font-style: normal; margin-top: 6px }
.ask { font-style: italic; font-weight: 600; font-size: 19px; line-height: 1.4 }
.ref { font-family: var(--sans); font-size: .8em; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 99px; padding: 1px 9px 2px; cursor: pointer; white-space: nowrap; line-height: 1.6 }
.ref:hover { background: var(--accent); color: var(--accent-ink) }
.point { display: grid; gap: 12px }
.point h4 { font-size: 18px; line-height: 1.5; margin: 0; font-weight: 700; display: grid; grid-template-columns: auto 1fr; gap: 10px }
.point h4 .n { font-family: var(--sans); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: 2px }
.passage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 4px; min-width: 0 }
.passage > .ref { font-size: 13px; margin-bottom: 4px }
.vs { margin: 0 0 10px; line-height: 2.05 }
.vn { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 4px; vertical-align: 2px }
.b { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--accent); background: var(--blank); border: 0; border-bottom: 2px solid var(--muted); border-radius: 4px 4px 0 0; padding: 0 6px; min-width: 5ch; max-width: 100%; text-align: center; line-height: 1.6 }
.b:focus { outline: none; border-bottom-color: var(--accent); background: var(--accent-soft) }
.b[readonly] { cursor: default }
.b.long { display: block; width: 100%; text-align: left; padding: 8px 10px; min-height: 120px; resize: vertical; line-height: 1.5; border-radius: 8px 8px 0 0 }
.b.key { color: var(--ok); border-bottom-color: var(--ok) }
.b.ok { border-bottom-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent) }
.b.miss { border-bottom-color: var(--miss); background: color-mix(in srgb, var(--miss) 14%, transparent); color: var(--miss) }
.b.empty { border-bottom-style: dashed }
.fix { font-family: var(--sans); font-size: 11.5px; font-weight: 700; color: var(--ok); margin: 0 4px 0 2px; white-space: nowrap }
.prayer { margin: 0; padding: 16px 18px; border-left: 3px solid var(--accent); font-style: italic; font-weight: 600; font-size: 17.5px; line-height: 1.55; background: var(--surface); border-radius: 0 12px 12px 0 }
.assure { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-family: var(--sans); font-size: 15px }
.assure li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 600 }
.end { text-align: center; color: var(--muted); letter-spacing: .3em }
.dock { position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); z-index: 4; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.08) }
.nonav-page .dock { bottom: calc(8px + env(safe-area-inset-bottom, 0px)) }
.seg { display: inline-flex; background: var(--blank); border-radius: 99px; padding: 3px; font-size: 12.5px; font-weight: 700 }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 99px; cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.reader.big { font-size: 21px }
.reader.big .b { font-size: 18px }

/* verse sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .2s }
.scrim.on { opacity: 1 }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; width: min(560px, 100%); transform: translate(-50%, 100%); transition: transform .25s ease;
  background: var(--surface); border-radius: 18px 18px 0 0; max-height: 78vh; display: flex; flex-direction: column;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.18) }
.sheet.on { transform: translate(-50%, 0) }
.grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.sheet h4 { margin: 0; font-size: 18px; font-family: var(--serif) }
.sheet .kjv { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin-left: 8px; font-family: var(--sans) }
.close { border: 0; background: var(--blank); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1 }
.sheet-body { overflow-y: auto; margin-top: 10px; font-family: var(--serif); font-size: 18px; line-height: 1.6 }
.sheet-body p { margin: 0 0 10px }
.sheet-body sup { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); margin-right: 3px }

/* certificate */
.cert { background: #fbfcf9; color: #1e2620; border-radius: 6px; padding: clamp(22px, 6vw, 48px); text-align: center; display: grid; gap: 10px; border: 1px solid #c9d3c6; box-shadow: inset 0 0 0 8px #fbfcf9, inset 0 0 0 9px #2f5d3a; font-family: var(--serif) }
.cert .c-church { font-family: var(--sans); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: #2f5d3a }
.cert .c-title { font-size: clamp(26px, 7vw, 40px); font-weight: 700; line-height: 1.1 }
.cert .c-name { font-size: clamp(28px, 8vw, 44px); font-style: italic; border-bottom: 1px solid #9aa89d; padding-bottom: 4px; margin: 6px auto 0; min-width: 60%; max-width: 100% }
.cert .c-sub { font-size: 16px; color: #45524a }
.cert .c-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 26px }
.cert .c-sign div { border-top: 1px solid #45524a; padding-top: 6px; font-size: 14px }
.cert .c-sign small { display: block; font-family: var(--sans); font-size: 11px; color: #5b685e; letter-spacing: .06em; text-transform: uppercase }
.cert .c-meta { font-family: var(--sans); font-size: 11.5px; color: #5b685e; margin-top: 14px; font-variant-numeric: tabular-nums }
@media print {
  body * { visibility: hidden }
  .cert, .cert * { visibility: visible }
  .cert { position: fixed; inset: 0; margin: 0; border-radius: 0; display: grid; align-content: center }
  @page { size: landscape; margin: 12mm }
}
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .fill { transition: none } }

#app.nonav-page ~ .toast { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 66px) }
.dock .row .btn { flex: 1 1 auto }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.filters .i { min-width: 0 }
.row > select.i { min-width: 0 }

/* tracking edition */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.checklist li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-top: 1px solid var(--line) }
.checklist li:first-child { border-top: 0 }
.checklist .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 2px; color: var(--accent-ink) }
.checklist li.done .tick { background: var(--accent); border-color: var(--accent) }
.checklist li.part .tick { border-color: var(--accent); border-style: dashed }
.cl-body { display: grid; gap: 1px; min-width: 0 }
.cl-num { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.cl-title { font-family: var(--serif); font-size: 16.5px; font-weight: 600; line-height: 1.3 }
.cl-sub { font-size: 12.5px; color: var(--muted) }
.checklist li.done .cl-sub { color: var(--ok); font-weight: 600 }
.next { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: var(--surface); border-radius: 10px; padding: 10px 12px }
.next-l { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.next b { font-family: var(--serif); font-size: 18px }
.verse { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px }
.verse blockquote { margin: 0; font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.5 }
.verse figcaption { font-size: 13px }
.verse figcaption b { color: var(--accent) }
.confirm { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)) }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)) } }
.person-item { grid-template-columns: 1fr }
.person-item .t { white-space: normal }
.person-item .row { gap: 6px }

</style>
</head>
<body>
<div id="app"><p class="loading">Loading…</p></div>
<script>
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (a && a.querySelector('.loading') && !a.querySelector('.boot-err')) {

<script>

<script>
/* ============================================================
   MBBE Discipleship Tracker — shared app logic (tracking edition)
   Lessons are taught from the printed booklet. The app records
   sessions, progress, graduation, certificates and yearly status.
   The same code runs in Google Apps Script (Sheets adapter in
   Code.gs) and in the browser demo (local adapter).
   ============================================================ */
var CORE = (function () {
  var SCHEMA = {
    Users: ['UserID', 'Name', 'Mobile', 'PinHash', 'Role', 'CongregationID', 'Status', 'DisciplerID', 'ModCongregations', 'AppointedBy', 'AppointedAt', 'FailCount', 'LockUntil', 'CreatedAt', 'LastLogin'],
    Congregations: ['CongregationID', 'Name', 'Location', 'Preachers', 'Status'],
    Lessons: ['LessonID', 'Level', 'LevelName', 'Order', 'Number', 'Title', 'MemoryRef', 'MemoryText', 'Published', 'UpdatedAt'],
    Enrollments: ['EnrollmentID', 'UserID', 'ProgramYear', 'Level', 'Status', 'StartDate', 'CompletedDate', 'ExpiryDate', 'ApprovedBy'],
    Sessions: ['SessionID', 'EnrollmentID', 'UserID', 'DisciplerID', 'LessonID', 'Date', 'Finished', 'Notes', 'NextMeeting', 'Confirmed', 'ConfirmedAt', 'CreatedAt'],
    Certificates: ['CertNo', 'UserID', 'EnrollmentID', 'ProgramYear', 'Level', 'LevelName', 'IssuedDate', 'IssuedBy', 'ValidUntil'],
    AuditLog: ['Timestamp', 'UserID', 'Action', 'Target', 'Details'],
    Settings: ['Key', 'Value']
  };
  var DEFAULTS = {
    ChurchName: 'Metropolitan Bible Baptist Ekklesia',
    ProgramName: 'Discovery Lessons',
    ValidityDays: '365',
    StaleDays: '30',
    Signatory1: '', Signatory1Title: 'Senior Pastor',
    Signatory2: '', Signatory2Title: 'Moderator'
  };
  var ROLES = ['Disciple', 'Discipler', 'Moderator', 'Admin'];
  var RANK = { Disciple: 0, Discipler: 1, Moderator: 2, Admin: 3 };
  var TOKEN_DAYS = 30;
  var DAY = 864e5;

  var db; // adapter for this request

  function fail(msg) { throw new Error(msg); }
  function nowIso() { return db.now().toISOString(); }
  function str(v) { return v == null ? '' : String(v); }
  function rows(t) { return db.all(t); }
  function find(t, k, v) { var r = rows(t); for (var i = 0; i < r.length; i++) if (str(r[i][k]) === str(v)) return r[i]; return null; }
  function audit(actor, action, target, details) {
    db.insert('AuditLog', { Timestamp: nowIso(), UserID: actor ? actor.UserID : '', Action: action, Target: target || '', Details: details || '' });
  }
  function settings() {
    var s = {}; Object.keys(DEFAULTS).forEach(function (k) { s[k] = DEFAULTS[k]; });
    rows('Settings').forEach(function (r) { if (r.Key) s[r.Key] = str(r.Value); });
    return s;
  }
  // Manila calendar date (UTC+8) as YYYY-MM-DD
  function today() { return new Date(db.now().getTime() + 8 * 36e5).toISOString().slice(0, 10); }
  function dayMs(d) { return Date.parse(str(d).slice(0, 10) + 'T00:00:00Z'); }
  function isDate(d) { return /^\d{4}-\d{2}-\d{2}$/.test(str(d)) && !isNaN(dayMs(d)); }
  function normMobile(m) {
    var d = str(m).replace(/\D/g, '');
    if (d.indexOf('63') === 0 && d.length === 12) d = '0' + d.slice(2);
    if (d.length === 10 && d[0] === '9') d = '0' + d;
    return d;
  }
  function checkPin(p) { if (!/^\d{4,6}$/.test(str(p))) fail('PIN must be 4 to 6 digits.'); }
  function hashPin(pin, salt) { salt = salt || db.uid(); return salt + '$' + db.hash(salt + ':' + pin); }
  function pinOk(pin, stored) { var s = str(stored).split('$'); return s.length === 2 && hashPin(pin, s[0]) === stored; }

  function makeToken(u) {
    var exp = db.now().getTime() + TOKEN_DAYS * DAY;
    var body = u.UserID + '.' + exp;
    return body + '.' + db.sign(body);
  }
  function auth(token) {
    var p = str(token).split('.');
    if (p.length !== 3 || db.sign(p[0] + '.' + p[1]) !== p[2] || +p[1] < db.now().getTime()) fail('AUTH: Please sign in again.');
    var u = find('Users', 'UserID', p[0]);
    if (!u || u.Status !== 'Active') fail('AUTH: Your account is not active. Ask your moderator.');
    return u;
  }
  function need(u, role) { if (RANK[u.Role] < RANK[role]) fail('You do not have access to this.'); }
  function scope(u) {
    if (u.Role === 'Admin') return null; // all
    if (u.Role === 'Moderator') return str(u.ModCongregations).split(',').map(function (s) { return s.trim(); }).filter(String);
    return [u.CongregationID];
  }
  function inScope(u, target) { var s = scope(u); return s === null || s.indexOf(target.CongregationID) >= 0; }
  function canGuide(u, target) {
    if (target.UserID === u.UserID) return false;
    if (RANK[u.Role] >= 2) return inScope(u, target);
    return u.Role === 'Discipler' && target.DisciplerID === u.UserID;
  }
  function pub(u) {
    if (!u) return null;
    return { UserID: u.UserID, Name: u.Name, Mobile: u.Mobile, Role: u.Role, CongregationID: u.CongregationID, Status: u.Status, DisciplerID: u.DisciplerID, ModCongregations: u.ModCongregations, CreatedAt: u.CreatedAt, LastLogin: u.LastLogin };
  }
  function congName(id) { var c = find('Congregations', 'CongregationID', id); return c ? c.Name : ''; }
  function userName(id) { var u = find('Users', 'UserID', id); return u ? u.Name : ''; }

  /* ---------- lessons (titles + memory verses; content stays in the booklet) ---------- */
  function isPub(l) { return str(l.Published).toUpperCase() === 'TRUE'; }
  function lessonsFor(level, all) {
    return rows('Lessons').filter(function (l) { return str(l.Level) === str(level) && (all || isPub(l)); })
      .sort(function (a, b) { return (+a.Order) - (+b.Order); });
  }
  function levelName(level) { var l = lessonsFor(level, true)[0]; return l && l.LevelName ? l.LevelName : 'Level ' + level; }
  function lessonMeta(l) { return { LessonID: l.LessonID, Level: l.Level, LevelName: l.LevelName, Order: l.Order, Number: l.Number, Title: l.Title, MemoryRef: l.MemoryRef, MemoryText: l.MemoryText, Published: isPub(l) }; }

  /* ---------- enrollments & sessions ---------- */
  function status(e) {
    if (!e) return 'Not started';
    if (e.Status === 'Completed' && e.ExpiryDate && new Date(e.ExpiryDate) < db.now()) return 'Expired';
    return e.Status;
  }
  function current(userId) {
    var e = rows('Enrollments').filter(function (r) { return r.UserID === userId; })
      .sort(function (a, b) { return str(b.StartDate).localeCompare(str(a.StartDate)); });
    return e[0] || null;
  }
  function sessionsOf(enrId) {
    return rows('Sessions').filter(function (s) { return s.EnrollmentID === enrId; })
      .sort(function (a, b) { return str(b.Date).localeCompare(str(a.Date)) || str(b.CreatedAt).localeCompare(str(a.CreatedAt)); });
  }
  function sessionView(s) {
    var l = find('Lessons', 'LessonID', s.LessonID);
    return { SessionID: s.SessionID, Date: s.Date, LessonID: s.LessonID, Lesson: l ? l.Number : s.LessonID, LessonTitle: l ? l.Title : '', Finished: s.Finished === 'TRUE', Notes: s.Notes, NextMeeting: s.NextMeeting, Confirmed: s.Confirmed === 'TRUE', ConfirmedAt: s.ConfirmedAt, Discipler: userName(s.DisciplerID), DisciplerID: s.DisciplerID };
  }
  function progress(e) {
    var out = { lessons: [], total: 0, finished: 0, sessions: [], lastSession: '', nextMeeting: '', unconfirmed: 0 };
    if (!e) return out;
    var ss = sessionsOf(e.EnrollmentID), t = today();
    out.sessions = ss.map(sessionView);
    out.lastSession = ss.length ? ss[0].Date : '';
    out.unconfirmed = ss.filter(function (s) { return s.Confirmed !== 'TRUE'; }).length;
    for (var i = 0; i < ss.length; i++) if (ss[i].NextMeeting) { if (ss[i].NextMeeting >= t) out.nextMeeting = ss[i].NextMeeting; break; }
    lessonsFor(e.Level).forEach(function (l) {
      var mine = ss.filter(function (s) { return s.LessonID === l.LessonID; });
      var done = mine.filter(function (s) { return s.Finished === 'TRUE'; }).map(function (s) { return s.Date; }).sort();
      var m = lessonMeta(l);
      m.FinishedOn = done[0] || ''; m.Sessions = mine.length;
      m.State = done.length ? 'Finished' : mine.length ? 'Started' : 'Not started';
      if (done.length) out.finished++;
      out.total++;
      out.lessons.push(m);
    });
    return out;
  }
  function enrView(e) {
    if (!e) return null;
    return { EnrollmentID: e.EnrollmentID, ProgramYear: e.ProgramYear, Level: e.Level, LevelName: levelName(e.Level), Status: status(e), StartDate: e.StartDate, CompletedDate: e.CompletedDate, ExpiryDate: e.ExpiryDate, ApprovedBy: userName(e.ApprovedBy) };
  }
  // Which level the next session belongs to
  function logLevel(e) {
    var st = status(e);
    if (!e || st === 'Expired') return 1;
    if (st === 'Completed') return lessonsFor(+e.Level + 1).length ? +e.Level + 1 : null;
    return +e.Level;
  }
  function overview(u) {
    var e = current(u.UserID), p = progress(e);
    var verses = [];
    rows('Enrollments').filter(function (x) { return x.UserID === u.UserID; }).forEach(function (en) {
      progress(en).lessons.forEach(function (l) {
        if (l.FinishedOn && l.MemoryText && !verses.some(function (v) { return v.LessonID === l.LessonID; })) verses.push({ LessonID: l.LessonID, Lesson: l.Number, Title: l.Title, Ref: l.MemoryRef, Text: l.MemoryText, Level: l.Level, Order: l.Order });
      });
    });
    verses.sort(function (a, b) { return (+a.Level - +b.Level) || (+a.Order - +b.Order); });
    return {
      enrollment: enrView(e), progress: p, discipler: userName(u.DisciplerID), memoryVerses: verses,
      certificates: rows('Certificates').filter(function (c) { return c.UserID === u.UserID; }).reverse(),
      settings: { StaleDays: settings().StaleDays }
    };
  }

  /* ---------- people ---------- */
  function scopedUsers(u) {
    var s = scope(u);
    return rows('Users').filter(function (x) { return s === null || s.indexOf(x.CongregationID) >= 0; });
  }
  function personRow(x) {
    var e = current(x.UserID), p = progress(e), st = status(e), staleDays = +settings().StaleDays || 30;
    var since = p.lastSession ? dayMs(p.lastSession) : (e ? dayMs(str(e.StartDate).slice(0, 10)) : 0);
    var stale = st === 'In progress' && since && (dayMs(today()) - since) / DAY > staleDays;
    var expiring = st === 'Completed' && e.ExpiryDate && (new Date(e.ExpiryDate) - db.now()) / DAY <= 60;
    return {
      UserID: x.UserID, Name: x.Name, Mobile: x.Mobile, Role: x.Role, Status: x.Status,
      CongregationID: x.CongregationID, Congregation: congName(x.CongregationID),
      DisciplerID: x.DisciplerID, Discipler: userName(x.DisciplerID), ModCongregations: x.ModCongregations,
      Year: e ? e.ProgramYear : '', Level: e ? e.Level : '', EnrollmentID: e ? e.EnrollmentID : '',
      LessonStatus: st, Finished: p.finished, TotalLessons: p.total, Sessions: p.sessions.length,
      LastSession: p.lastSession, NextMeeting: p.nextMeeting, Unconfirmed: p.unconfirmed,
      ReadyToGraduate: st === 'In progress' && p.total > 0 && p.finished === p.total,
      Stale: !!stale, Expiring: !!expiring, ExpiryDate: e ? e.ExpiryDate : '',
      HasCert: e ? rows('Certificates').some(function (c) { return c.EnrollmentID === e.EnrollmentID; }) : false,
      CreatedAt: x.CreatedAt
    };
  }
  function target(u, id, mustScope) {
    var t = find('Users', 'UserID', id);
    if (!t) fail('Person not found.');
    if (mustScope && !inScope(u, t)) fail('This person is outside your congregations.');
    return t;
  }

  /* ---------- actions ---------- */
  var A = {};
  A.ping = function () { return { ok: true, time: nowIso() }; };
  A.publicInfo = function () {
    var s = settings();
    return { churchName: s.ChurchName, programName: s.ProgramName, congregations: rows('Congregations').filter(function (c) { return c.Status !== 'Inactive'; }).map(function (c) { return { CongregationID: c.CongregationID, Name: c.Name, Location: c.Location }; }) };
  };
  A.register = function (q) {
    var name = str(q.name).trim(), mobile = normMobile(q.mobile);
    if (name.length < 3) fail('Please enter your full name.');
    if (!/^09\d{9}$/.test(mobile)) fail('Enter a mobile number like 0917 123 4567.');
    checkPin(q.pin);
    if (!find('Congregations', 'CongregationID', q.congregationId)) fail('Please choose your congregation.');
    if (find('Users', 'Mobile', mobile)) fail('This mobile number is already registered. Sign in instead, or ask your moderator to reset your PIN.');
    var u = { UserID: 'U-' + db.uid().slice(0, 8), Name: name, Mobile: mobile, PinHash: hashPin(q.pin), Role: 'Disciple', CongregationID: q.congregationId, Status: 'Pending', DisciplerID: '', ModCongregations: '', AppointedBy: '', AppointedAt: '', FailCount: '0', LockUntil: '', CreatedAt: nowIso(), LastLogin: '' };
    db.insert('Users', u);
    audit(u, 'Registered', u.UserID, congName(u.CongregationID));
    return { pending: true };
  };
  A.login = function (q) {
    var u = find('Users', 'Mobile', normMobile(q.mobile));
    if (!u) fail('No account uses that mobile number.');
    if (u.LockUntil && new Date(u.LockUntil) > db.now()) fail('Too many wrong PINs. Try again in 15 minutes, or ask your moderator to reset it.');
    if (!pinOk(str(q.pin), u.PinHash)) {
      var n = (+u.FailCount || 0) + 1;
      db.update('Users', 'UserID', u.UserID, { FailCount: String(n), LockUntil: n >= 5 ? new Date(db.now().getTime() + 15 * 6e4).toISOString() : '' });
      fail('Wrong PIN. ' + (n >= 5 ? 'Account locked for 15 minutes.' : (5 - n) + ' tries left.'));
    }
    if (u.Status === 'Pending') fail('Your registration is waiting for approval by your moderator.');
    if (u.Status !== 'Active') fail('Your account is inactive. Ask your moderator.');
    db.update('Users', 'UserID', u.UserID, { FailCount: '0', LockUntil: '', LastLogin: nowIso() });
    return { token: makeToken(u), user: pub(u) };
  };
  A.me = function (q, u) {
    return { user: pub(u), congregation: congName(u.CongregationID), settings: settings(), congregations: rows('Congregations'), scope: scope(u) };
  };
  A.changePin = function (q, u) {
    if (!pinOk(str(q.oldPin), u.PinHash)) fail('Your current PIN is not correct.');
    checkPin(q.newPin);
    db.update('Users', 'UserID', u.UserID, { PinHash: hashPin(q.newPin) });
    audit(u, 'Changed PIN', u.UserID);
    return { ok: true };
  };

  /* disciple */
  A.home = function (q, u) {
    var o = overview(u);
    o.progress.sessions.forEach(function (s) { s.Notes = ''; }); // discipler notes stay private
    return o;
  };
  A.confirmSession = function (q, u) {
    var s = find('Sessions', 'SessionID', q.sessionId);
    if (!s || s.UserID !== u.UserID) fail('Session not found.');
    if (s.Confirmed === 'TRUE') return { ok: true };
    db.update('Sessions', 'SessionID', s.SessionID, { Confirmed: 'TRUE', ConfirmedAt: nowIso() });
    audit(u, 'Confirmed session', s.DisciplerID, s.Date + ' ' + s.LessonID);
    return { ok: true };
  };
  A.certificate = function (q, u) {
    var c = find('Certificates', 'CertNo', q.certNo);
    if (!c) fail('Certificate not found.');
    var owner = find('Users', 'UserID', c.UserID);
    if (c.UserID !== u.UserID && !(RANK[u.Role] >= 1 && (canGuide(u, owner) || u.UserID === owner.DisciplerID))) fail('You cannot view this certificate.');
    return { cert: c, name: owner.Name, congregation: congName(owner.CongregationID), settings: settings(), issuedBy: userName(c.IssuedBy) };
  };

  /* discipler */
  A.myDisciples = function (q, u) {
    need(u, 'Discipler');
    return { people: rows('Users').filter(function (x) { return x.DisciplerID === u.UserID && x.Status === 'Active'; }).map(personRow) };
  };
  A.person = function (q, u) {
    var t = target(u, q.userId);
    if (!canGuide(u, t)) fail('You can only view your own disciples.');
    var o = overview(t), e = current(t.UserID), lv = logLevel(e);
    o.person = personRow(t);
    o.logLevel = lv;
    o.logLessons = lv ? lessonsFor(lv).map(lessonMeta) : [];
    o.canLog = !!lv && o.logLessons.length > 0;
    return o;
  };
  A.logSession = function (q, u) {
    need(u, 'Discipler');
    var t = target(u, q.userId);
    if (!canGuide(u, t)) fail('You can only log sessions for your own disciples.');
    if (t.Status !== 'Active') fail('This account is not active.');
    var l = find('Lessons', 'LessonID', q.lessonId);
    if (!l || !isPub(l)) fail('Choose the lesson you covered.');
    var d = str(q.date);
    if (!isDate(d)) fail('Enter the date you met.');
    if (d > today()) fail('The meeting date can’t be in the future.');
    var nm = str(q.nextMeeting);
    if (nm && (!isDate(nm) || nm < d)) fail('The next meeting must be on or after the session date.');
    var e = current(t.UserID), lv = logLevel(e);
    if (!lv) fail(t.Name + ' has completed every level for this year.');
    if (str(l.Level) !== String(lv)) fail('This lesson isn’t part of ' + t.Name.split(' ')[0] + '’s current level (' + levelName(lv) + ').');
    if (!e || status(e) !== 'In progress') {
      e = { EnrollmentID: 'E-' + db.uid().slice(0, 8), UserID: t.UserID, ProgramYear: d.slice(0, 4), Level: String(lv), Status: 'In progress', StartDate: d + 'T00:00:00.000Z', CompletedDate: '', ExpiryDate: '', ApprovedBy: '' };
      db.insert('Enrollments', e);
      audit(u, 'Started lessons', t.UserID, levelName(lv) + ' ' + e.ProgramYear);
    }
    var s = { SessionID: 'S-' + db.uid().slice(0, 8), EnrollmentID: e.EnrollmentID, UserID: t.UserID, DisciplerID: u.UserID, LessonID: l.LessonID, Date: d, Finished: q.finished === false || q.finished === 'false' ? 'FALSE' : 'TRUE', Notes: str(q.notes).slice(0, 1000), NextMeeting: nm, Confirmed: 'FALSE', ConfirmedAt: '', CreatedAt: nowIso() };
    db.insert('Sessions', s);
    audit(u, 'Logged session', t.UserID, l.Number + (s.Finished === 'TRUE' ? ' finished' : ' continued') + ' · ' + d);
    return { ok: true, session: sessionView(s) };
  };
  A.deleteSession = function (q, u) {
    need(u, 'Discipler');
    var s = find('Sessions', 'SessionID', q.sessionId);
    if (!s) fail('Session not found.');
    var t = target(u, s.UserID);
    if (!(s.DisciplerID === u.UserID || (RANK[u.Role] >= 2 && inScope(u, t)))) fail('Only the discipler who logged it, or a moderator, can remove this session.');
    var e = find('Enrollments', 'EnrollmentID', s.EnrollmentID);
    if (e && e.Status !== 'In progress') fail('This level is already completed, so its sessions can’t be removed.');
    db.update('Sessions', 'SessionID', s.SessionID, { EnrollmentID: 'deleted:' + s.EnrollmentID, UserID: 'deleted:' + s.UserID });
    audit(u, 'Removed session', t.UserID, s.Date + ' ' + s.LessonID);
    return { ok: true };
  };
  A.graduate = function (q, u) {
    need(u, 'Discipler');
    var e = find('Enrollments', 'EnrollmentID', q.enrollmentId);
    if (!e) fail('Enrollment not found.');
    var t = target(u, e.UserID);
    if (!canGuide(u, t)) fail('You can only approve your own disciples.');
    if (status(e) !== 'In progress') fail('This level is already ' + status(e).toLowerCase() + '.');
    var p = progress(e);
    if (!p.total || p.finished < p.total) fail('All ' + p.total + ' lessons must be finished first (' + p.finished + ' finished).');
    var days = +settings().ValidityDays || 365;
    db.update('Enrollments', 'EnrollmentID', e.EnrollmentID, { Status: 'Completed', CompletedDate: nowIso(), ExpiryDate: new Date(db.now().getTime() + days * DAY).toISOString(), ApprovedBy: u.UserID });
    audit(u, 'Approved to graduate', t.UserID, levelName(e.Level) + ' ' + e.ProgramYear);
    return { ok: true };
  };
  A.lessonList = function (q, u) {
    return { lessons: rows('Lessons').filter(function (l) { return RANK[u.Role] >= 3 || isPub(l); }).sort(function (a, b) { return (+a.Level - +b.Level) || (+a.Order - +b.Order); }).map(lessonMeta) };
  };

  /* moderator */
  A.dashboard = function (q, u) {
    need(u, 'Moderator');
    var all = scopedUsers(u);
    var people = all.filter(function (x) { return x.Status === 'Active' && RANK[x.Role] <= 1; }).map(personRow);
    var counts = { people: people.length, pending: all.filter(function (x) { return x.Status === 'Pending'; }).length, 'Not started': 0, 'In progress': 0, Completed: 0, Expired: 0, stale: 0, ready: 0, expiring: 0, unassigned: 0 };
    people.forEach(function (p) {
      counts[p.LessonStatus] = (counts[p.LessonStatus] || 0) + 1;
      if (p.Stale) counts.stale++; if (p.ReadyToGraduate) counts.ready++; if (p.Expiring) counts.expiring++;
      if (p.Role === 'Disciple' && !p.DisciplerID) counts.unassigned++;
    });
    var monthAgo = new Date(dayMs(today()) - 30 * DAY).toISOString().slice(0, 10);
    var disciplers = all.filter(function (x) { return x.Role === 'Discipler' && x.Status === 'Active'; }).map(function (d) {
      var mine = people.filter(function (p) { return p.DisciplerID === d.UserID; });
      var recent = rows('Sessions').filter(function (s) { return s.DisciplerID === d.UserID && s.Date >= monthAgo && str(s.UserID).indexOf('deleted:') !== 0; }).length;
      return { UserID: d.UserID, Name: d.Name, Congregation: congName(d.CongregationID), Disciples: mine.length, Completed: mine.filter(function (p) { return p.LessonStatus === 'Completed'; }).length, InProgress: mine.filter(function (p) { return p.LessonStatus === 'In progress'; }).length, Stale: mine.filter(function (p) { return p.Stale; }).length, Sessions30: recent };
    });

    Adapter: Adapter, seed: seed
  };
})();
if (typeof module !== 'undefined') module.exports = DEMO;

</script>
<script>
(function () {
  'use strict';
  var CFG = window.APP_CONFIG || {};
  var DEMO_MODE = !CFG.API_URL;
  var IS_ARTIFACT = !!CFG.IS_ARTIFACT;
  var TOKEN_KEY = DEMO_MODE ? 'dt-token-demo' : 'dt-token';

  /* ---------- small helpers ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var LS = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var S = { token: LS.get(TOKEN_KEY), me: null, info: null };
  var app = document.getElementById('app');

  function fmtDate(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function rel(iso) {
    if (!iso) return 'never';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' hr ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' days ago';
    return fmtDate(iso);
  }
  var PILL = { 'Completed': 'ok', 'Active': 'ok', 'In progress': 'info', 'Pending': 'warn', 'Returned': 'miss', 'Expired': 'miss', 'Inactive': 'miss' };
  function pill(t, label) { return '<span class="pill ' + (PILL[t] || '') + '">' + esc(label || t) + '</span>'; }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function confirmTap(btn, label, fn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; fn(); return; }
      btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
      setTimeout(function () { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
    });
  }
  function busy(btn, on) { if (!btn) return; btn.disabled = on; }

  /* ---------- api ---------- */
  function api(action, params) {
    var req = Object.assign({ action: action, token: S.token }, params || {});
    var p = DEMO_MODE
      ? new Promise(function (res) { setTimeout(function () { res(DEMO.call(req)); }, 120); })
      : (function () {
          var ctl = window.AbortController ? new AbortController() : null;
          var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
          return fetch(CFG.API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(req), signal: ctl ? ctl.signal : undefined })
            .then(function (r) { return r.text(); })
            .then(function (t) {
              clearTimeout(timer);
              try { return JSON.parse(t); }
              catch (e) { return { ok: false, error: 'The server sent an unexpected reply. In Apps Script, check that the deployment is a Web app with “Who has access” set to Anyone.' }; }
            })
            .catch(function (e) {
              clearTimeout(timer);
              return { ok: false, offline: true, error: e && e.name === 'AbortError' ? 'The server is taking too long to answer. Please try again.' : 'Can’t reach the server. Check your internet connection and try again.' };
            });
        })();
    return p.then(function (res) {
      if (!res.ok) { var e = new Error(res.error); e.auth = res.auth; e.offline = res.offline; if (res.auth) { signOut(); } throw e; }
      return res.data;
    });
  }
  function signOut() { S.token = null; S.me = null; LS.del(TOKEN_KEY); location.hash = '#/login'; }

  /* ---------- icons ---------- */
  var IC = {
    home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.6c2 .8 3.2 2.6 3.6 5.4"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
    award: '<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M19 19v2H6"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"/>',
    more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'
  };
  function icon(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>'; }

  /* ---------- layout ---------- */
  function role() { return S.me ? S.me.user.Role : ''; }
  function rank() { return { Disciple: 0, Discipler: 1, Moderator: 2, Admin: 3 }[role()] || 0; }
  function navItems() {
    var r = role();
    if (r === 'Disciple') return [['home', 'My progress', 'home'], ['certs', 'Certificates', 'award'], ['profile', 'Profile', 'user']];
    if (r === 'Discipler') return [['disciples', 'Disciples', 'users'], ['home', 'My progress', 'home'], ['certs', 'Certificates', 'award'], ['profile', 'Profile', 'user']];
    return [['dash', 'Dashboard', 'chart'], ['people', 'People', 'users'], ['reports', 'Reports', 'table'], ['certadmin', 'Certificates', 'award'], ['more', 'More', 'more']];
  }
  function homeRoute() { return { Disciple: 'home', Discipler: 'disciples' }[role()] || 'dash'; }
  function frame(o) {
    var cur = (location.hash.replace('#/', '').split('/')[0]) || homeRoute();
    var u = S.me.user;
    app.innerHTML =
      '<header class="top"><div class="top-in">' +
        (o.back ? '<button type="button" class="back" id="back" aria-label="Back">‹</button>' : '') +
        '<h1>' + esc(o.title) + '</h1>' +
        '<div class="who"><b>' + esc(u.Name) + '</b>' + esc(u.Role) + (DEMO_MODE ? ' · demo' : '') + '</div>' +
      '</div></header>' +
      '<main class="page' + (o.nav === false ? ' nonav' : '') + '" id="main">' + (o.body || '<p class="loading">Loading…</p>') + '</main>' +
      (o.nav === false ? '' : '<nav class="nav" aria-label="Main"><div class="nav-in">' + navItems().map(function (n) {
        var on = n[0] === cur || (o.section && o.section === n[0]);
        return '<a href="#/' + n[0] + '"' + (on ? ' aria-current="page"' : '') + '>' + icon(n[2]) + '<span>' + n[1] + '</span></a>';
      }).join('') + '</div></nav>');
    app.classList.toggle('nonav-page', o.nav === false);
    S.hash = location.hash;
    if (o.tools) $('.top-in').insertAdjacentHTML('beforeend', o.tools);
    if (o.back) $('#back').onclick = function () { if (typeof o.back === 'string') location.hash = o.back; else history.back(); };
    window.scrollTo(0, 0);
    return $('#main');
  }
  function fill(html) {
    var m = $('#main');
    if (!m || S.hash !== location.hash) return document.createElement('div'); // a slower, older screen finished loading; ignore it
    m.innerHTML = html; return m;
  }
  function failView(e) { fill('<div class="card"><p class="err">' + esc(e.message) + '</p><button class="btn" type="button" onclick="location.reload()">Try again</button></div>'); }

  /* ---------- auth screens ---------- */
  function authShell(body) {
    app.innerHTML = '<div class="auth"><div class="auth-in">' +
      '<div class="brand"><div class="eyebrow">' + esc(S.info ? S.info.churchName : 'Metropolitan Bible Baptist Ekklesia') + '</div><h1>Discipleship</h1><p class="muted">' + esc(S.info ? S.info.programName : 'Discovery Lessons') + ' · yearly progress, meetings and certificates</p></div>' +
      body + '</div></div>';
  }
  function loadInfo() { return S.info ? Promise.resolve(S.info) : api('publicInfo').then(function (i) { S.info = i; return i; }); }

  function viewLogin() {
    loadInfo().catch(function () {}).then(function () {
      authShell(
        '<form id="f" class="card" novalidate>' +
          '<label class="f">Mobile number<input class="i" id="mobile" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567" required></label>' +
          '<label class="f">PIN<input class="i" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="4 to 6 digits" required></label>' +
          '<p class="err" id="err" hidden></p>' +
          '<button class="btn primary block" id="go">Sign in</button>' +
        '</form>' +
        '<p class="muted small">New to the discipleship lessons? <a href="#/register">Register here</a>. Forgot your PIN? Ask your discipler or moderator to reset it.</p>' +
        (DEMO_MODE ? '<div class="demo"><div><b>Demo mode.</b> Sample people and data, saved only on this device. Every demo PIN is <b>1234</b>. Sign in as:</div><div class="row">' +
          [['Admin', '09170000001'], ['Moderator', '09170000002'], ['Discipler', '09170000003'], ['Disciple', '09170000005']].map(function (d) { return '<button type="button" class="btn sm" data-demo="' + d[1] + '">' + d[0] + '</button>'; }).join('') +
          '</div></div>' : ''));
      var f = $('#f');
      f.onsubmit = function (e) {
        e.preventDefault(); var b = $('#go'); busy(b, true); $('#err').hidden = true;
        api('login', { mobile: $('#mobile').value, pin: $('#pin').value }).then(function (r) {
          S.token = r.token; LS.set(TOKEN_KEY, r.token); S.me = null; location.hash = '#/'; route();
        }).catch(function (e2) { $('#err').textContent = e2.message; $('#err').hidden = false; busy(b, false); });
      };
      $$('[data-demo]').forEach(function (b) { b.onclick = function () { $('#mobile').value = b.dataset.demo; $('#pin').value = '1234'; f.requestSubmit ? f.requestSubmit() : f.onsubmit(new Event('submit')); }; });
    });
  }
  function viewRegister() {
    loadInfo().then(function (info) {
      authShell(
        '<form id="f" class="card" novalidate><h2>Register as a disciple</h2>' +
          '<label class="f">Full name<input class="i" id="name" autocomplete="name" required></label>' +
          '<label class="f">Mobile number<input class="i" id="mobile" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567" required></label>' +
          '<label class="f">Congregation<select class="i" id="cong" required><option value="">Choose your congregation</option>' +
            info.congregations.map(function (c) { return '<option value="' + esc(c.CongregationID) + '">' + esc(c.Name) + (c.Location ? ' · ' + esc(c.Location) : '') + '</option>'; }).join('') + '</select></label>' +
          '<label class="f">Choose a PIN<input class="i" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="4 to 6 digits"></label>' +
          '<label class="f">Type the PIN again<input class="i" id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
          '<p class="small muted">Your account is personal. Please don’t share your PIN.</p>' +
          '<p class="err" id="err" hidden></p><button class="btn primary block" id="go">Register</button>' +
        '</form><p class="muted small">Already registered? <a href="#/login">Sign in</a></p>');
      $('#f').onsubmit = function (e) {
        e.preventDefault(); var err = $('#err'); err.hidden = true;
        if ($('#pin').value !== $('#pin2').value) { err.textContent = 'The two PINs don’t match.'; err.hidden = false; return; }
        busy($('#go'), true);
        api('register', { name: $('#name').value, mobile: $('#mobile').value, pin: $('#pin').value, congregationId: $('#cong').value }).then(function () {
          authShell('<div class="card"><h2>Thank you for registering</h2><p>Your moderator will approve your account and assign a discipler. You can sign in once you’re approved.</p><a class="btn primary" href="#/login">Back to sign in</a></div>');
        }).catch(function (e2) { err.textContent = e2.message; err.hidden = false; busy($('#go'), false); });
      };
    }).catch(function (e) { authShell('<div class="card"><p class="err">' + esc(e.message) + '</p></div>'); });
  }

  /* ---------- shared bits for the tracking views ---------- */
  function fmtDay(d) { if (!d) return ''; var x = new Date(String(d).slice(0, 10) + 'T12:00:00'); return isNaN(x) ? '' : x.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function fmtDayShort(d) { if (!d) return ''; var x = new Date(String(d).slice(0, 10) + 'T12:00:00'); return isNaN(x) ? '' : x.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function daysAgo(d) { if (!d) return null; return Math.round((new Date(todayStr() + 'T12:00:00') - new Date(String(d).slice(0, 10) + 'T12:00:00')) / 864e5); }
  function agoText(d) { var n = daysAgo(d); if (n == null) return 'never'; if (n <= 0) return 'today'; if (n === 1) return 'yesterday'; if (n < 45) return n + ' days ago'; return fmtDay(d); }
  var CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function checklist(lessons) {
    if (!lessons.length) return '<p class="muted">No lessons are set up for this level yet.</p>';
    return '<ol class="checklist">' + lessons.map(function (l) {
      var cls = l.State === 'Finished' ? 'done' : l.State === 'Started' ? 'part' : '';
      var sub = l.State === 'Finished' ? 'Finished ' + fmtDay(l.FinishedOn) : l.State === 'Started' ? 'Started · ' + l.Sessions + ' session' + (l.Sessions === 1 ? '' : 's') + ' so far' : 'Not yet';
      return '<li class="' + cls + '"><span class="tick">' + (cls === 'done' ? CHECK : '') + '</span><span class="cl-body"><span class="cl-num">' + esc(l.Number) + '</span><span class="cl-title">' + esc(l.Title) + '</span><span class="cl-sub">' + sub + '</span></span></li>';
    }).join('') + '</ol>';
  }
  function progressBar(p) {
    var pct = p.total ? Math.round(p.finished / p.total * 100) : 0;
    return '<div class="track" role="progressbar" aria-label="Lessons finished" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:' + pct + '%"></div></div>';
  }

  /* ---------- disciple: my progress ---------- */
  function viewHome() {
    var r = role();
    frame({ title: r === 'Disciple' ? 'My discipleship' : 'My progress', section: r === 'Disciple' ? 'home' : (r === 'Discipler' ? 'home' : 'more'), back: rank() >= 2 ? '#/more' : null });
    api('home').then(function (d) {
      var e = d.enrollment, p = d.progress, yr = new Date().getFullYear(), first = S.me.user.Name.split(' ')[0];
      var html = '<div class="card hero">';
      if (!e) {
        html += '<h3>' + yr + ' discipleship</h3><h2>Welcome, ' + esc(first) + '</h2>' +
          '<p>You’ll go through the Discovery Lessons with ' + (d.discipler ? '<b>' + esc(d.discipler) + '</b>' : 'your discipler') + ' using the printed booklet. Each time you meet, your discipler records the lesson here so you can follow your progress.</p>' +
          (d.discipler ? '' : '<p class="small">Your moderator will assign your discipler soon.</p>');
      } else {
        html += '<div class="spread"><h3>Program year ' + esc(e.ProgramYear) + '</h3>' + pill(e.Status) + '</div>' +
          '<h2>' + esc(e.LevelName) + '</h2>' + progressBar(p) +
          '<p class="small"><b>' + p.finished + ' of ' + p.total + '</b> lessons finished' + (d.discipler ? ' · Discipler: <b>' + esc(d.discipler) + '</b>' : '') + '</p>';
        if (e.Status === 'In progress' && p.nextMeeting) html += '<div class="next"><span class="next-l">Next meeting</span><b>' + esc(fmtDayShort(p.nextMeeting)) + '</b></div>';
        if (e.Status === 'In progress' && p.total && p.finished === p.total) html += '<p class="small">All lessons finished. Your discipler will confirm that you’re ready to graduate.</p>';
        if (e.Status === 'Completed') {
          html += '<p>Completed on ' + fmtDate(e.CompletedDate) + '. Your discipleship status is valid until <b>' + fmtDate(e.ExpiryDate) + '</b>.</p>';
          var left = Math.ceil((new Date(e.ExpiryDate) - new Date()) / 864e5);
          if (left <= 60) html += '<p class="small"><b>Renew soon.</b> Your status expires in ' + left + ' day' + (left === 1 ? '' : 's') + '. Plan this year’s lessons with your discipler.</p>';
        }
        if (e.Status === 'Expired') html += '<p>Your completion expired on ' + fmtDate(e.ExpiryDate) + '. Retake the lessons with your discipler to renew your status for ' + yr + '.</p>';
      }
      html += '</div>';

      var pending = p.sessions.filter(function (s) { return !s.Confirmed; });
      if (pending.length) {
        html += '<h3>Please confirm</h3><div class="list">' + pending.map(function (s) {
          return '<div class="card confirm" data-sid="' + esc(s.SessionID) + '"><p>Did you meet with <b>' + esc(s.Discipler) + '</b> on <b>' + esc(fmtDayShort(s.Date)) + '</b> for <b>' + esc(s.Lesson) + '</b>?</p><div class="row"><button type="button" class="btn primary sm" data-confirm>Yes, we met</button><span class="small muted">If not, tell your discipler.</span></div></div>';
        }).join('') + '</div>';
      }
      if (e && e.Status === 'Completed') {
        var c = d.certificates.filter(function (x) { return x.EnrollmentID === e.EnrollmentID; })[0];
        html += c ? '<a class="card" href="#/cert/' + esc(c.CertNo) + '"><div class="spread"><b>Your certificate is ready</b>' + pill('Completed', 'View') + '</div><p class="small muted">' + esc(c.CertNo) + ' · issued ' + fmtDate(c.IssuedDate) + '</p></a>'
          : '<div class="card"><p>Congratulations on finishing the lessons. Your moderator will issue your certificate.</p></div>';
      }
      if (e) html += '<h3>Lessons</h3>' + checklist(p.lessons);
      if (d.memoryVerses.length) {
        html += '<h3>Memory verses</h3><div class="list">' + d.memoryVerses.map(function (v) {
          return '<figure class="verse"><blockquote>“' + esc(v.Text) + '”</blockquote><figcaption><b>' + esc(v.Ref) + '</b> · KJV<span class="muted"> · ' + esc(v.Lesson) + '</span></figcaption></figure>';
        }).join('') + '</div>';
      }
      if (p.sessions.length) {
        html += '<h3>Meetings</h3><div class="list">' + p.sessions.map(function (s) {
          return '<div class="item" style="cursor:default"><div class="t">' + esc(fmtDay(s.Date)) + '</div>' + (s.Confirmed ? '<span class="small muted">Confirmed</span>' : pill('Pending', 'To confirm')) +
            '<div class="s">' + esc(s.Lesson) + ' · ' + esc(s.LessonTitle) + (s.Finished ? '' : ' (continued next time)') + ' · with ' + esc(s.Discipler) + '</div></div>';
        }).join('') + '</div>';
      }
      var m = fill(html);
      $$('[data-confirm]', m).forEach(function (b) {
        b.onclick = function () {
          var c = b.closest('[data-sid]'); busy(b, true);
          api('confirmSession', { sessionId: c.dataset.sid }).then(function () { toast('Thank you. Meeting confirmed.'); viewHome(); }).catch(function (x) { toast(x.message); busy(b, false); });
        };
      });
    }).catch(failView);
  }
  /* ---------- certificates ---------- */
  function viewMyCerts() {
    frame({ title: 'Certificates' });
    api('home').then(function (d) {
      fill(d.certificates.length ? '<div class="list">' + d.certificates.map(function (c) {
        var valid = new Date(c.ValidUntil) > new Date();
        return '<a class="item" href="#/cert/' + esc(c.CertNo) + '"><div class="t">' + esc(c.LevelName) + ' · ' + esc(c.ProgramYear) + '</div>' + pill(valid ? 'Completed' : 'Expired', valid ? 'Valid' : 'Expired') + '<div class="s">' + esc(c.CertNo) + ' · valid until ' + fmtDate(c.ValidUntil) + '</div></a>';
      }).join('') + '</div>' : '<div class="card"><h2>No certificates yet</h2><p>When you finish your lessons and your discipler approves you, your moderator issues your certificate. It will appear here.</p></div>');
    }).catch(failView);
  }
  function viewCert(no) {
    frame({ title: 'Certificate', back: true, nav: false });
    api('certificate', { certNo: no }).then(function (r) {
      var s = r.settings, c = r.cert;
      fill('<div class="cert" id="cert">' +
        '<div class="c-church">' + esc(s.ChurchName) + '</div>' +
        '<div class="c-title">Certificate of Completion</div>' +
        '<div class="c-sub">This certifies that</div>' +
        '<div class="c-name">' + esc(r.name) + '</div>' +
        '<div class="c-sub">has faithfully completed the ' + esc(s.ProgramName) + '<br><b>' + esc(c.LevelName) + '</b><br>' + esc(r.congregation) + ' · Program year ' + esc(c.ProgramYear) + '</div>' +
        '<div class="c-sign"><div>' + esc(s.Signatory1 || ' ') + '<small>' + esc(s.Signatory1Title) + '</small></div><div>' + esc(s.Signatory2 || r.issuedBy) + '<small>' + esc(s.Signatory2Title) + '</small></div></div>' +
        '<div class="c-meta">No. ' + esc(c.CertNo) + ' · Issued ' + fmtDate(c.IssuedDate) + ' · Valid until ' + fmtDate(c.ValidUntil) + '</div>' +
        '</div>' +
        (IS_ARTIFACT ? '<p class="small muted">In the live app this page has a Print / Save as PDF button.</p>' : '<button type="button" class="btn primary" id="print">Print or save as PDF</button>'));
      var p = $('#print'); if (p) p.onclick = function () { window.print(); };
    }).catch(failView);
  }

  /* ---------- discipler ---------- */
  function flags(p) {
    var f = '';
    if (p.Status !== 'Active') return pill(p.Status);
    if (p.ReadyToGraduate) f += pill('Pending', 'Ready to graduate');
    else if (p.Stale) f += pill('Returned', p.LastSession ? 'No meeting ' + daysAgo(p.LastSession) + 'd' : 'No meeting yet');
    else if (p.Expiring) f += pill('Pending', 'Expires ' + fmtDate(p.ExpiryDate));
    return f + pill(p.LessonStatus);
  }
  function personItem(p, extra) {
    var sub = [];
    if (extra !== 'nodisc') sub.push(p.Congregation);
    if (p.TotalLessons && p.LessonStatus !== 'Not started') sub.push(p.Finished + '/' + p.TotalLessons + ' lessons');
    if (p.LastSession) sub.push('last met ' + agoText(p.LastSession));
    if (p.NextMeeting) sub.push('next ' + fmtDayShort(p.NextMeeting));

  function viewPerson(uid) {

      }
