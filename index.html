<style>
/* Layout: phone-first single column; sticky top bar, fixed bottom tab bar; lesson pages read like the booklet. */
/* Layout: phone-first single column; navy top bar, fixed bottom tab bar. Palette from the MBBE logo: deep navy, flame orange, royal blue. */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --raise: #f6f7fb; --ink: #1b2236; --muted: #5a6278; --line: #dbdfe9;
  --accent: #243049; --accent-ink: #ffffff; --accent-soft: #e8ebf4; --blank: #eceef4;
  --flame: #e05a1c; --flame-a: #f6b13a; --flame-b: #e64a26; --flame-soft: #fdeee2;
  --nav: #243049; --nav-ink: #ffffff; --nav-muted: rgba(255, 255, 255, .72);
  --ok: #2c7a4b; --warn: #b0640b; --miss: #c0392b; --info: #2e4a9a; --scrim: rgba(20, 26, 40, .45);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Manrope", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121828; --surface: #1a2236; --raise: #1f283e; --ink: #e8ebf3; --muted: #9ca5ba; --line: #2b3550;
  --accent: #f3a15c; --accent-ink: #1b2236; --accent-soft: #252f47; --blank: #232c43;
  --flame: #f3a15c; --flame-a: #f8c45a; --flame-b: #ee6a3a; --flame-soft: #3a2b25;
  --nav: #1a2236; --nav-ink: #e8ebf3; --nav-muted: rgba(232, 235, 243, .7);
  --ok: #7fcb98; --warn: #e6b45e; --miss: #f08a7a; --info: #92b2f0; --scrim: rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121828; --surface: #1a2236; --raise: #1f283e; --ink: #e8ebf3; --muted: #9ca5ba; --line: #2b3550;
  --accent: #f3a15c; --accent-ink: #1b2236; --accent-soft: #252f47; --blank: #232c43;
  --flame: #f3a15c; --flame-a: #f8c45a; --flame-b: #ee6a3a; --flame-soft: #3a2b25;
  --nav: #1a2236; --nav-ink: #e8ebf3; --nav-muted: rgba(232, 235, 243, .7);
  --ok: #7fcb98; --warn: #e6b45e; --miss: #f08a7a; --info: #92b2f0; --scrim: rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
a { color: var(--accent) }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 36px }
.top h1 { font-family: var(--serif); font-size: 19px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700 }
.back { border: 0; background: var(--blank); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; flex: none }
.who { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; flex: none; max-width: 45% }
.who b { display: block; color: var(--ink); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

/* page */
.page { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px }
.page.nonav { padding-block-end: 48px }
h2 { font-family: var(--serif); font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance }
h3 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; font-weight: 700 }
p { margin: 0 }
.muted { color: var(--muted) }
.small { font-size: 13px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.stack { display: grid; gap: 10px }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0 }
.card.hero { background: var(--accent-soft); border-color: transparent }
a.card, button.card { text-decoration: none; color: inherit; text-align: left; cursor: pointer; width: 100% }
a.card:hover, button.card:hover { border-color: var(--accent) }
.list { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; cursor: pointer; text-align: left; width: 100% }
.item:hover { border-color: var(--accent) }
.item .t { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.item .s { grid-column: 1 / -1; font-size: 13px; color: var(--muted) }
.lesson-item .num { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.lesson-item .t { font-family: var(--serif); font-size: 17px }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--blank); color: var(--muted); white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent) }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent) }
.pill.miss { color: var(--miss); background: color-mix(in srgb, var(--miss) 14%, transparent) }
.pill.info { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent) }
.pill.plain::before { display: none }

.track { height: 8px; background: var(--blank); border-radius: 99px; overflow: hidden }
.fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 2px }
.tile:hover { border-color: var(--accent) }
.tile b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; font-family: var(--serif) }
.tile span { font-size: 12.5px; color: var(--muted); font-weight: 600 }
.tile.alert b { color: var(--warn) }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--miss); border-color: color-mix(in srgb, var(--miss) 45%, transparent) }
.btn.quiet { border-color: transparent; background: none; color: var(--muted) }
.btn.block { width: 100% }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px }
.btn[disabled] { opacity: .5; cursor: not-allowed }

form { display: grid; gap: 12px }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--muted) }
input.i, select.i, textarea.i { width: 100%; font-size: 16px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px }
textarea.i { min-height: 110px; resize: vertical; line-height: 1.45 }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; min-height: 180px }
input.i:focus, select.i:focus, textarea.i:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.err { color: var(--miss); font-weight: 600; font-size: 14px }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.chip .n { opacity: .75; margin-left: 4px }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--raise); position: sticky; top: 0 }
tr:last-child td { border-bottom: 0 }
td.num, th.num { text-align: right }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--raise) }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.nav-in { max-width: 760px; margin: 0 auto; display: flex; height: var(--nav-h) }
.nav a { flex: 1; display: grid; place-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; border-radius: 10px; position: relative }
.nav a svg { width: 22px; height: 22px }
.nav a[aria-current="page"] { color: var(--accent) }
.nav a[aria-current="page"]::after { content: ""; position: absolute; top: 2px; width: 26px; height: 3px; border-radius: 3px; background: var(--accent) }

  /* ---------- small helpers ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };

  function fmtDate(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function rel(iso) {
    if (!iso) return 'never';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' hr ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' days ago';
    return fmtDate(iso);
  }

  }
  function confirmTap(btn, label, fn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; fn(); return; }
      btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
      setTimeout(function () { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
    });
  }

  /* ---------- api ---------- */
  function api(action, params) {
    var req = Object.assign({ action: action, token: S.token }, params || {});
    var p = DEMO_MODE
      ? new Promise(function (res) { setTimeout(function () { res(DEMO.call(req)); }, 120); })
      : (function () {
          var ctl = window.AbortController ? new AbortController() : null;
          var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
          return fetch(CFG.API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(req), signal: ctl ? ctl.signal : undefined })
            .then(function (r) { return r.text(); })
            .then(function (t) {
              clearTimeout(timer);
              try { return JSON.parse(t); }
              catch (e) { return { ok: false, error: 'The server sent an unexpected reply. In Apps Script, check that the deployment is a Web app with “Who has access” set to Anyone.' }; }
            })
            .catch(function (e) {
              clearTimeout(timer);
              return { ok: false, offline: true, error: e && e.name === 'AbortError' ? 'The server is taking too long to answer. Please try again.' : 'Can’t reach the server. Check your internet connection and try again.' };
            });
        })();
    return p.then(function (res) {
      if (!res.ok) { var e = new Error(res.error); e.auth = res.auth; e.offline = res.offline; if (res.auth) { signOut(); } throw e; }
      if (READS[action]) LS.set(ckey(action, params), { t: Date.now(), d: res.data });
      else if (S.token && action !== 'login' && action !== 'publicInfo') clearCache(false);
      return res.data;
    });
  }
  function signOut() { S.token = null; S.me = null; LS.del(TOKEN_KEY); clearCache(true); location.hash = '#/login'; }

  /* ---------- instant screens: show the last copy, then refresh ---------- */
  var READS = { me: 1, home: 1, myDisciples: 1, person: 1, people: 1, dashboard: 1, report: 1, certQueue: 1, lessonList: 1, auditLog: 1, certificate: 1 };
  var CPRE = DEMO_MODE ? 'dtc-demo:' : 'dtc:';
  function ckey(action, params) { return CPRE + String(S.token || '').split('.')[0] + ':' + action + ':' + JSON.stringify(params || {}); }
  function clearCache(all) {
    try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(CPRE) === 0 && (all || k.indexOf(':me:') < 0)) localStorage.removeItem(k); }); } catch (e) {}
  }
  function editing() { var a = document.activeElement, m = $('#main'); return !!(a && m && m.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
  function live(action, params, render) {
    var c = LS.get(ckey(action, params)), shown = c ? JSON.stringify(c.d) : null;
    if (c) render(c.d, true);
    api(action, params).then(function (d) {
      if (JSON.stringify(d) === shown || (shown && editing())) return;
      render(d, false);
    }).catch(function (e) { if (!shown) failView(e); else if (e.offline) toast('Offline. Showing the last saved copy.'); });
  }
  function liveAll(list, render) {
    var cached = list.map(function (x) { return LS.get(ckey(x[0], x[1])); });
    var have = cached.every(Boolean), shown = have ? JSON.stringify(cached.map(function (c) { return c.d; })) : null;
    if (have) render(cached.map(function (c) { return c.d; }), true);
    Promise.all(list.map(function (x) { return api(x[0], x[1]); })).then(function (res) {
      if (JSON.stringify(res) === shown || (shown && editing())) return;
      render(res, false);
    }).catch(function (e) { if (!shown) failView(e); else if (e.offline) toast('Offline. Showing the last saved copy.'); });
  }

  /* ---------- shared bits for the tracking views ---------- */
  function fmtDay(d) { if (!d) return ''; var x = new Date(String(d).slice(0, 10) + 'T12:00:00'); return isNaN(x) ? '' : x.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function fmtDayShort(d) { if (!d) return ''; var x = new Date(String(d).slice(0, 10) + 'T12:00:00'); return isNaN(x) ? '' : x.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function daysAgo(d) { if (!d) return null; return Math.round((new Date(todayStr() + 'T12:00:00') - new Date(String(d).slice(0, 10) + 'T12:00:00')) / 864e5); }
  function agoText(d) { var n = daysAgo(d); if (n == null) return 'never'; if (n <= 0) return 'today'; if (n === 1) return 'yesterday'; if (n < 45) return n + ' days ago'; return fmtDay(d); }
  var CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function checklist(lessons) {
    if (!lessons.length) return '<p class="muted">No lessons are set up for this level yet.</p>';
    return '<ol class="checklist">' + lessons.map(function (l) {
      var cls = l.State === 'Finished' ? 'done' : l.State === 'Started' ? 'part' : '';
      var sub = l.State === 'Finished' ? 'Finished ' + fmtDay(l.FinishedOn) : l.State === 'Started' ? 'Started · ' + l.Sessions + ' session' + (l.Sessions === 1 ? '' : 's') + ' so far' : 'Not yet';
      return '<li class="' + cls + '"><span class="tick">' + (cls === 'done' ? CHECK : '') + '</span><span class="cl-body"><span class="cl-num">' + esc(l.Number) + '</span><span class="cl-title">' + esc(l.Title) + '</span><span class="cl-sub">' + sub + '</span></span></li>';
    }).join('') + '</ol>';
  }
  function progressBar(p) {
    var pct = p.total ? Math.round(p.finished / p.total * 100) : 0;
    return '<div class="track" role="progressbar" aria-label="Lessons finished" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:' + pct + '%"></div></div>';
  }

          }).join('') + '</div>';
        }).join(''));
      $$('[data-pub]', m).forEach(function (b) { b.onclick = function () { api('setPublished', { lessonId: b.dataset.pub, published: !!b.dataset.on }).then(function () { toast(b.dataset.on ? 'Lesson included in the checklist.' : 'Lesson hidden from the checklist.'); viewLessonsAdmin(); }).catch(function (x) { toast(x.message); }); }; });
    });
  }
  function viewLessonEdit(id) {
    var isNew = id === 'new';
    frame({ title: isNew ? 'New lesson' : 'Edit lesson', back: '#/setup/lessons', section: 'more' });
    live('lessonList', null, function (r) {
      var l = r.lessons.filter(function (x) { return x.LessonID === id; })[0];
      if (!isNew && !l) throw new Error('Lesson not found.');
      l = l || { Level: '1', LevelName: (r.lessons[0] || {}).LevelName || 'The Foundation · Level One', Order: r.lessons.length + 1 };
      fill('<form class="card" id="f">' +
        '<div class="row"><label class="f" style="flex:2 1 140px">Lesson code<input class="i" id="lid" value="' + esc(isNew ? '' : id) + '"' + (isNew ? '' : ' readonly') + ' placeholder="e.g. L2-01" autocapitalize="characters"></label>' +
        '<label class="f" style="flex:1 1 70px">Level<input class="i" id="lv" inputmode="numeric" value="' + esc(l.Level) + '"></label><label class="f" style="flex:1 1 70px">Order<input class="i" id="lo" inputmode="numeric" value="' + esc(l.Order) + '"></label></div>' +
        '<label class="f">Level name<input class="i" id="ln" value="' + esc(l.LevelName) + '"></label>' +
        '<label class="f">Lesson number<input class="i" id="lnum" value="' + esc(l.Number || '') + '" placeholder="Lesson Two"></label>' +
        '<label class="f">Title<input class="i" id="lt" value="' + esc(l.Title || '') + '" required></label>' +
        '<label class="f">Memory verse reference<input class="i" id="mr" value="' + esc(l.MemoryRef || '') + '" placeholder="John 3:16"></label>' +
        '<label class="f">Memory verse text (KJV)<textarea class="i" id="mt" placeholder="Type the verse exactly as in the King James Version">' + esc(l.MemoryText || '') + '</textarea></label>' +
        '<p class="small muted">Lessons with the same level are tracked together. Order sets their position in the checklist.</p>' +
        '<button class="btn primary">Save lesson</button></form>');
      $('#f').onsubmit = function (e) {
        e.preventDefault();
        api('saveLesson', { isNew: isNew, LessonID: $('#lid').value.trim(), Level: $('#lv').value, Order: $('#lo').value, LevelName: $('#ln').value, Number: $('#lnum').value, Title: $('#lt').value, MemoryRef: $('#mr').value, MemoryText: $('#mt').value })
          .then(function () { toast('Lesson saved.'); location.hash = '#/setup/lessons'; }).catch(function (x) { toast(x.message); });
      };
    });
  }
  function viewSettings() {
    frame({ title: 'Settings', back: '#/more', section: 'more' });
    live('me', null, function (me) {
      var s = me.settings;
      var F = [['ChurchName', 'Church name'], ['ProgramName', 'Program name (on certificates)'], ['ValidityDays', 'Days a completion stays valid'], ['StaleDays', 'Flag disciples with no meeting after this many days'], ['Signatory1', 'Certificate signatory 1'], ['Signatory1Title', 'Signatory 1 title'], ['Signatory2', 'Certificate signatory 2'], ['Signatory2Title', 'Signatory 2 title']];
      fill('<form class="card" id="f">' + F.map(function (x) { return '<label class="f">' + x[1] + '<input class="i" id="s-' + x[0] + '" value="' + esc(s[x[0]]) + '"' + (/Days$/.test(x[0]) ? ' inputmode="numeric"' : '') + '></label>'; }).join('') +
        '<p class="small muted">If signatory 2 is blank, the certificate shows the coordinator who issued it.</p><button class="btn primary">Save settings</button></form>');
      $('#f').onsubmit = function (e) { e.preventDefault(); var q = {}; F.forEach(function (x) { q[x[0]] = $('#s-' + x[0]).value; }); api('saveSettings', q).then(function () { toast('Settings saved.'); S.info = null; }).catch(function (x) { toast(x.message); }); };
    });
  }

  /* ---------- profile ---------- */
  function viewProfile() {
    frame({ title: 'Profile', section: rank() >= 2 ? 'more' : 'profile', back: rank() >= 2 ? '#/more' : null });
    var u = S.me.user;
    var m = fill('<div class="card"><h2>' + esc(u.Name) + '</h2><p class="small muted">' + esc(u.Role) + ' · ' + esc(S.me.congregation) + ' · ' + esc(u.Mobile) + '</p></div>' +
      '<form class="card" id="f"><h3>Change PIN</h3><label class="f">Current PIN<input class="i" id="op" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>' +
      '<label class="f">New PIN<input class="i" id="np" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><button class="btn">Change PIN</button></form>' +
      '<button type="button" class="btn" id="out">Sign out</button>' +
      (DEMO_MODE ? '<div class="demo"><div><b>Demo mode.</b> Reset brings back the original sample people and progress.</div><div><button type="button" class="btn sm" id="reset">Reset demo data</button></div></div>' : ''));
    $('#f').onsubmit = function (e) { e.preventDefault(); api('changePin', { oldPin: $('#op').value, newPin: $('#np').value }).then(function () { toast('PIN changed.'); $('#f').reset(); }).catch(function (x) { toast(x.message); }); };
    $('#out').onclick = signOut;
    var r = $('#reset', m); if (r) confirmTap(r, 'Tap again to reset', function () { DEMO.reset(); signOut(); toast('Demo data reset.'); });
  }

  /* ---------- router ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent), v = parts[0];
    if (!S.token) { return v === 'register' ? viewRegister() : viewLogin(); }
    if (!S.me) {
      var cm = LS.get(ckey('me', null));
      if (cm) { S.me = cm.d; api('me').then(function (me) { S.me = me; }).catch(function () {}); return route(); }
      app.innerHTML = loadingHTML();
      return api('me').then(function (me) { S.me = me; route(); }).catch(function (e) { if (!e.auth) authShell('<div class="card"><p class="err">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>'); });
    }
    var R = rank();
    var routes = {
      '': function () { location.replace('#/' + homeRoute()); },
      login: function () { location.replace('#/' + homeRoute()); },
      register: function () { location.replace('#/' + homeRoute()); },
      home: viewHome, certs: viewMyCerts, cert: function () { viewCert(parts[1]); }, profile: viewProfile,
      disciples: R >= 1 && viewDisciples, person: R >= 1 && function () { viewPerson(parts[1]); },
      dash: R >= 2 && viewDash, people: R >= 2 && function () { viewPeople(parts[1]); }, reports: R >= 2 && function () { viewReports(parts[1], parts[2]); },
      certadmin: R >= 2 && viewCertAdmin, more: R >= 2 && viewMore, audit: R >= 2 && viewAudit,
      setup: R >= 3 && function () { ({ congregations: viewCongs, lessons: viewLessonsAdmin, lesson: function () { viewLessonEdit(parts[2]); }, settings: viewSettings }[parts[1]] || viewMore)(); }
    };
    (routes[v] || function () { location.replace('#/' + homeRoute()); })();
  }

  /* ---------- global events ---------- */
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go;
  });
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
