<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#243049">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discipleship">
<title>MBBE Discipleship</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column; sticky top bar, fixed bottom tab bar; lesson pages read like the booklet. */
/* Layout: phone-first single column; navy top bar, fixed bottom tab bar. Palette from the MBBE logo: deep navy, flame orange, royal blue. */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --raise: #f6f7fb; --ink: #1b2236; --muted: #5a6278; --line: #dbdfe9;
  --accent: #243049; --accent-ink: #ffffff; --accent-soft: #e8ebf4; --blank: #eceef4;
  --flame: #e05a1c; --flame-a: #f6b13a; --flame-b: #e64a26; --flame-soft: #fdeee2;
  --nav: #243049; --nav-ink: #ffffff; --nav-muted: rgba(255, 255, 255, .72);
  --ok: #2c7a4b; --warn: #b0640b; --miss: #c0392b; --info: #2e4a9a; --scrim: rgba(20, 26, 40, .45);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Manrope", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121828; --surface: #1a2236; --raise: #1f283e; --ink: #e8ebf3; --muted: #9ca5ba; --line: #2b3550;
  --accent: #f3a15c; --accent-ink: #1b2236; --accent-soft: #252f47; --blank: #232c43;
  --flame: #f3a15c; --flame-a: #f8c45a; --flame-b: #ee6a3a; --flame-soft: #3a2b25;
  --nav: #1a2236; --nav-ink: #e8ebf3; --nav-muted: rgba(232, 235, 243, .7);
  --ok: #7fcb98; --warn: #e6b45e; --miss: #f08a7a; --info: #92b2f0; --scrim: rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121828; --surface: #1a2236; --raise: #1f283e; --ink: #e8ebf3; --muted: #9ca5ba; --line: #2b3550;
  --accent: #f3a15c; --accent-ink: #1b2236; --accent-soft: #252f47; --blank: #232c43;
  --flame: #f3a15c; --flame-a: #f8c45a; --flame-b: #ee6a3a; --flame-soft: #3a2b25;
  --nav: #1a2236; --nav-ink: #e8ebf3; --nav-muted: rgba(232, 235, 243, .7);
  --ok: #7fcb98; --warn: #e6b45e; --miss: #f08a7a; --info: #92b2f0; --scrim: rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
a { color: var(--accent) }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 36px }
.top h1 { font-family: var(--serif); font-size: 19px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700 }
.back { border: 0; background: var(--blank); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; flex: none }
.who { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; flex: none; max-width: 45% }
.who b { display: block; color: var(--ink); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

/* page */
.page { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px }
.page.nonav { padding-block-end: 48px }
h2 { font-family: var(--serif); font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance }
h3 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; font-weight: 700 }
p { margin: 0 }
.muted { color: var(--muted) }
.small { font-size: 13px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.stack { display: grid; gap: 10px }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0 }
.card.hero { background: var(--accent-soft); border-color: transparent }
a.card, button.card { text-decoration: none; color: inherit; text-align: left; cursor: pointer; width: 100% }
a.card:hover, button.card:hover { border-color: var(--accent) }
.list { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; cursor: pointer; text-align: left; width: 100% }
.item:hover { border-color: var(--accent) }
.item .t { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.item .s { grid-column: 1 / -1; font-size: 13px; color: var(--muted) }
.lesson-item .num { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.lesson-item .t { font-family: var(--serif); font-size: 17px }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--blank); color: var(--muted); white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent) }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent) }
.pill.miss { color: var(--miss); background: color-mix(in srgb, var(--miss) 14%, transparent) }
.pill.info { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent) }
.pill.plain::before { display: none }

.track { height: 8px; background: var(--blank); border-radius: 99px; overflow: hidden }
.fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 2px }
.tile:hover { border-color: var(--accent) }
.tile b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; font-family: var(--serif) }
.tile span { font-size: 12.5px; color: var(--muted); font-weight: 600 }
.tile.alert b { color: var(--warn) }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--miss); border-color: color-mix(in srgb, var(--miss) 45%, transparent) }
.btn.quiet { border-color: transparent; background: none; color: var(--muted) }
.btn.block { width: 100% }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px }
.btn[disabled] { opacity: .5; cursor: not-allowed }

form { display: grid; gap: 12px }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--muted) }
input.i, select.i, textarea.i { width: 100%; font-size: 16px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px }
textarea.i { min-height: 110px; resize: vertical; line-height: 1.45 }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; min-height: 180px }
input.i:focus, select.i:focus, textarea.i:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.err { color: var(--miss); font-weight: 600; font-size: 14px }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.chip .n { opacity: .75; margin-left: 4px }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--raise); position: sticky; top: 0 }
tr:last-child td { border-bottom: 0 }
td.num, th.num { text-align: right }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--raise) }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.nav-in { max-width: 760px; margin: 0 auto; display: flex; height: var(--nav-h) }
.nav a { flex: 1; display: grid; place-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; border-radius: 10px; position: relative }
.nav a svg { width: 22px; height: 22px }
.nav a[aria-current="page"] { color: var(--accent) }
.nav a[aria-current="page"]::after { content: ""; position: absolute; top: 2px; width: 26px; height: 3px; border-radius: 3px; background: var(--accent) }
.badge { position: absolute; top: 4px; left: 54%; background: var(--warn); color: #fff; font-size: 10px; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2) }
.demo { background: color-mix(in srgb, var(--info) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--info) 35%, transparent); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; display: grid; gap: 10px }
.demo b { color: var(--info) }
.loading { padding: 40px 0; text-align: center; color: var(--muted) }

/* auth */
.auth { min-height: 100%; display: grid; align-content: start; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 40px }
.auth-in { width: 100%; max-width: 420px; margin: 0 auto; display: grid; gap: 18px }
.brand .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent) }
.brand h1 { font-family: var(--serif); font-size: 34px; line-height: 1.1; margin: 6px 0 4px; font-weight: 700 }

/* lesson reader */
.reader { font-family: var(--serif); font-size: 17px; line-height: 1.65; display: grid; gap: 22px }
.reader .eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent) }
.reader h2.lt { font-size: clamp(26px, 6.5vw, 34px); line-height: 1.15; margin-top: 4px }
.memory { margin: 0; padding: 16px 18px; background: var(--accent-soft); border-radius: 14px; font-style: italic; font-size: 18px; line-height: 1.5 }
.memory .ref { font-style: normal; margin-top: 6px }
.ask { font-style: italic; font-weight: 600; font-size: 19px; line-height: 1.4 }
.ref { font-family: var(--sans); font-size: .8em; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 99px; padding: 1px 9px 2px; cursor: pointer; white-space: nowrap; line-height: 1.6 }
.ref:hover { background: var(--accent); color: var(--accent-ink) }
.point { display: grid; gap: 12px }
.point h4 { font-size: 18px; line-height: 1.5; margin: 0; font-weight: 700; display: grid; grid-template-columns: auto 1fr; gap: 10px }
.point h4 .n { font-family: var(--sans); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: 2px }
.passage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 4px; min-width: 0 }
.passage > .ref { font-size: 13px; margin-bottom: 4px }
.vs { margin: 0 0 10px; line-height: 2.05 }
.vn { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 4px; vertical-align: 2px }
.b { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--accent); background: var(--blank); border: 0; border-bottom: 2px solid var(--muted); border-radius: 4px 4px 0 0; padding: 0 6px; min-width: 5ch; max-width: 100%; text-align: center; line-height: 1.6 }
.b:focus { outline: none; border-bottom-color: var(--accent); background: var(--accent-soft) }
.b[readonly] { cursor: default }
.b.long { display: block; width: 100%; text-align: left; padding: 8px 10px; min-height: 120px; resize: vertical; line-height: 1.5; border-radius: 8px 8px 0 0 }
.b.key { color: var(--ok); border-bottom-color: var(--ok) }
.b.ok { border-bottom-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent) }
.b.miss { border-bottom-color: var(--miss); background: color-mix(in srgb, var(--miss) 14%, transparent); color: var(--miss) }
.b.empty { border-bottom-style: dashed }
.fix { font-family: var(--sans); font-size: 11.5px; font-weight: 700; color: var(--ok); margin: 0 4px 0 2px; white-space: nowrap }
.prayer { margin: 0; padding: 16px 18px; border-left: 3px solid var(--accent); font-style: italic; font-weight: 600; font-size: 17.5px; line-height: 1.55; background: var(--surface); border-radius: 0 12px 12px 0 }
.assure { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-family: var(--sans); font-size: 15px }
.assure li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 600 }
.end { text-align: center; color: var(--muted); letter-spacing: .3em }
.dock { position: sticky; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); z-index: 4; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.08) }
.nonav-page .dock { bottom: calc(8px + env(safe-area-inset-bottom, 0px)) }
.seg { display: inline-flex; background: var(--blank); border-radius: 99px; padding: 3px; font-size: 12.5px; font-weight: 700 }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 99px; cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.reader.big { font-size: 21px }
.reader.big .b { font-size: 18px }

/* verse sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .2s }
.scrim.on { opacity: 1 }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; width: min(560px, 100%); transform: translate(-50%, 100%); transition: transform .25s ease;
  background: var(--surface); border-radius: 18px 18px 0 0; max-height: 78vh; display: flex; flex-direction: column;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.18) }
.sheet.on { transform: translate(-50%, 0) }
.grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.sheet h4 { margin: 0; font-size: 18px; font-family: var(--serif) }
.sheet .kjv { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin-left: 8px; font-family: var(--sans) }
.close { border: 0; background: var(--blank); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1 }
.sheet-body { overflow-y: auto; margin-top: 10px; font-family: var(--serif); font-size: 18px; line-height: 1.6 }
.sheet-body p { margin: 0 0 10px }
.sheet-body sup { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--accent); margin-right: 3px }

/* certificate */
.cert { background: #fbfcf9; color: #1e2620; border-radius: 6px; padding: clamp(22px, 6vw, 48px); text-align: center; display: grid; gap: 10px; border: 1px solid #c9d3c6; box-shadow: inset 0 0 0 8px #fbfcf9, inset 0 0 0 9px #2f5d3a; font-family: var(--serif) }
.cert .c-church { font-family: var(--sans); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: #2f5d3a }
.cert .c-title { font-size: clamp(26px, 7vw, 40px); font-weight: 700; line-height: 1.1 }
.cert .c-name { font-size: clamp(28px, 8vw, 44px); font-style: italic; border-bottom: 1px solid #9aa89d; padding-bottom: 4px; margin: 6px auto 0; min-width: 60%; max-width: 100% }
.cert .c-sub { font-size: 16px; color: #45524a }
.cert .c-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 26px }
.cert .c-sign div { border-top: 1px solid #45524a; padding-top: 6px; font-size: 14px }
.cert .c-sign small { display: block; font-family: var(--sans); font-size: 11px; color: #5b685e; letter-spacing: .06em; text-transform: uppercase }
.cert .c-meta { font-family: var(--sans); font-size: 11.5px; color: #5b685e; margin-top: 14px; font-variant-numeric: tabular-nums }
@media print {
  body * { visibility: hidden }
  .cert, .cert * { visibility: visible }
  .cert { position: fixed; inset: 0; margin: 0; border-radius: 0; display: grid; align-content: center }
  @page { size: landscape; margin: 12mm }
}
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .fill { transition: none } }

#app.nonav-page ~ .toast { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 66px) }
.dock .row .btn { flex: 1 1 auto }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.filters .i { min-width: 0 }
.row > select.i { min-width: 0 }

/* tracking edition */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.checklist li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-top: 1px solid var(--line) }
.checklist li:first-child { border-top: 0 }
.checklist .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 2px; color: var(--accent-ink) }
.checklist li.done .tick { background: var(--accent); border-color: var(--accent) }
.checklist li.part .tick { border-color: var(--accent); border-style: dashed }
.cl-body { display: grid; gap: 1px; min-width: 0 }
.cl-num { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.cl-title { font-family: var(--serif); font-size: 16.5px; font-weight: 600; line-height: 1.3 }
.cl-sub { font-size: 12.5px; color: var(--muted) }
.checklist li.done .cl-sub { color: var(--ok); font-weight: 600 }
.next { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: var(--surface); border-radius: 10px; padding: 10px 12px }
.next-l { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.next b { font-family: var(--serif); font-size: 18px }
.verse { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px }
.verse blockquote { margin: 0; font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.5 }
.verse figcaption { font-size: 13px }
.verse figcaption b { color: var(--accent) }
.confirm { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)) }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)) } }
.person-item { grid-template-columns: 1fr }
.person-item .t { white-space: normal }
.person-item .row { gap: 6px }

/* ---------- brand layer ---------- */
body::before { background: var(--nav) }
.top { background: var(--nav); color: var(--nav-ink); border-bottom: 0 }
.top h1 { color: var(--nav-ink) }
.top .back { background: rgba(255, 255, 255, .14); color: var(--nav-ink) }
.who { color: var(--nav-muted) }
.who b { color: var(--nav-ink) }
.mark { width: 30px; height: 30px; flex: none; border-radius: 8px; display: block }
.fill { background: linear-gradient(90deg, var(--flame-a), var(--flame-b)) }
.checklist li.done .tick { background: var(--flame); border-color: var(--flame); color: #fff }
.checklist li.part .tick { border-color: var(--flame) }
.checklist li.done .cl-sub { color: var(--flame) }
.nav a[aria-current="page"] { color: var(--accent) }
.nav a[aria-current="page"]::after { background: var(--flame) }
.verse figcaption b { color: var(--flame) }
.card.hero { background: var(--accent-soft) }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.next b { color: var(--ink) }

/* loading */
.loading { padding: 56px 0; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 12px }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--blank); border-top-color: var(--flame); animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
.loading .slow { font-size: 13px; max-width: 280px }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s } }

/* sign-in */
.auth { background: var(--bg); padding: 0 0 40px; display: grid; gap: 20px; align-content: start }
.brand-band { background: var(--nav); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 36px 28px }
.brand-band .brand { max-width: 420px; margin: 0 auto }
.auth .auth-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.brand { color: var(--nav-ink); display: grid; gap: 4px }
.brand .logo { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25) }
.brand .eyebrow { color: var(--flame-a); display: flex; align-items: center; gap: 8px; margin-top: 10px }
.brand .church { width: 28px; height: 28px; border-radius: 50%; flex: none }
.brand h1 { color: var(--nav-ink) }
.brand p.muted { color: var(--nav-muted) }

/* dashboard */
.attn { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.attn a { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 13px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none }
.attn a:first-child { border-top: 0 }
.attn a:hover { background: var(--raise) }
.attn .dot { width: 10px; height: 10px; border-radius: 50% }
.attn .txt { display: grid; gap: 1px; min-width: 0 }
.attn .txt b { font-size: 15px }
.attn .txt span { font-size: 12.5px; color: var(--muted) }
.attn .go { color: var(--muted); font-size: 20px; line-height: 1 }
.calm { display: flex; gap: 10px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted) }
.glance { display: grid; gap: 12px }
.glance .big { font-family: var(--serif); font-size: 21px; line-height: 1.3 }
.glance .big b { font-size: 30px; color: var(--flame) }
.sbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--blank); gap: 2px }
.sbar span { display: block; height: 100%; min-width: 4px }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; padding: 0; list-style: none }
@media (min-width: 560px) { .legend { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.legend li { display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px; align-items: center; font-size: 13px; color: var(--muted) }
.legend li i { width: 10px; height: 10px; border-radius: 3px; grid-row: span 2 }
.legend li b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums }
.c-ok { background: var(--ok) } .c-info { background: var(--info) } .c-none { background: color-mix(in srgb, var(--muted) 45%, transparent) } .c-miss { background: var(--miss) } .c-warn { background: var(--warn) } .c-flame { background: var(--flame) }

/* certificate brand */
.cert { box-shadow: inset 0 0 0 8px #fbfcf9, inset 0 0 0 9px #243049 }
.cert .c-church { color: #243049 }
.cert .c-logo { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 4px }
.cert .c-title { color: #243049 }
.cert .c-rule { width: 80px; height: 3px; margin: 2px auto; background: linear-gradient(90deg, #f6b13a, #e64a26); border-radius: 3px }

/* ---------- photos, sync, sign-in extras ---------- */
.av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; background: var(--blank); display: block }
.av.sm { width: 28px; height: 28px }
.av.lg { width: 64px; height: 64px }
.av.xl { width: 96px; height: 96px }
.who { display: flex; align-items: center; gap: 8px; text-decoration: none }
.who .av { border: 2px solid rgba(255, 255, 255, .5) }
.sync { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .16); color: var(--nav-ink); white-space: nowrap; flex: none }
.sync.off { background: var(--warn); color: #fff }
.person-item { grid-template-columns: 40px 1fr; align-items: start }
.person-item .pi { display: grid; gap: 4px; min-width: 0 }
.person-head { display: flex; gap: 14px; align-items: flex-start }
.person-head h2 { margin-bottom: 4px }
.profile-card { display: flex; gap: 16px; align-items: center; flex-wrap: wrap }
.pill.sample { background: var(--flame-soft); color: var(--flame) }
.shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
.shot { position: relative; display: inline-block }
.av.shot-img { width: 72px; height: 72px; border-radius: 10px; cursor: zoom-in }
.shot .x { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-size: 14px; line-height: 1; cursor: pointer }
.addshot { width: 72px; height: 72px; border-radius: 10px; border: 2px dashed var(--line); background: none; color: var(--muted); font-size: 28px; cursor: pointer }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 24, .88); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5) }
.lightbox .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); background: rgba(255, 255, 255, .15); color: #fff; width: 40px; height: 40px; border-radius: 50%; border: 0; font-size: 22px }
.switch { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; cursor: pointer }
.switch input { position: absolute; opacity: 0; pointer-events: none }
.switch .sw { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s }
.switch input:checked + .sw { background: var(--flame) }
.switch input:checked + .sw::after { transform: translateX(18px) }
.switch input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px }
.switch > span:last-child { display: grid; gap: 2px }
.welcome { display: flex; gap: 12px; align-items: center }
.wname { font-family: var(--serif); font-size: 22px; font-weight: 700 }
.suggest-wrap { position: relative }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12) }
.suggest li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer }
.suggest li:hover, .suggest li:focus { background: var(--accent-soft); outline: none }
.suggest li span { color: var(--muted); font-variant-numeric: tabular-nums }
.picked { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; min-height: 46px }
.picked button { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted) }
.faces { display: inline-flex; margin-right: 6px; vertical-align: middle }
.faces .av { border: 2px solid var(--surface); margin-right: -8px }
.faces .av:last-child { margin-right: 4px }
.preacher { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
.preacher b { flex: 1; min-width: 120px }
.pick { padding: 6px 0; gap: 10px }
.previews { display: grid; gap: 10px }
.previews img { width: 100%; border-radius: 8px; border: 1px solid var(--line) }
.present-cta { gap: 4px; border-color: var(--flame); background: var(--flame-soft) }
.cert .c-photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 4px auto 0; border: 4px solid #243049 }
label.pick { flex-wrap: nowrap; align-items: center }
label.pick > span { min-width: 0 }

/* =================================================================
   v3 design layer: navy header with greeting, sync status and refresh;
   icon tiles; the journey (people moving through stages); floating
   menu with a big record button; wide layouts for tablet and computer.
   ================================================================= */
:root { --maxw: 760px; --wide: 1220px; --r: 18px; --gold: #f6b13a }
body { font-size: 15px }
.page.wide { max-width: var(--maxw) }

/* header */
.top { padding-block: 12px }
.top-in { max-width: var(--maxw); flex-wrap: wrap; gap: 10px 12px }
.top.main { padding-block: 16px 14px }
.ttl { flex: 1; min-width: 0; display: grid; gap: 1px }
.ttl .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold) }
.top.main h1 { font-size: 23px }
.top .back { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center }
.top .back svg { width: 20px; height: 20px }
.mark { width: 34px; height: 34px; border-radius: 10px }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .14); color: var(--nav-ink); display: grid; place-items: center; cursor: pointer; flex: none }
.iconbtn svg { width: 19px; height: 19px }
.iconbtn:hover { background: rgba(255, 255, 255, .22) }
.iconbtn.spinning svg { animation: spin 1s linear infinite }
.who { max-width: none }
.who .av { width: 40px; height: 40px }
.sync-row { order: 9; flex-basis: 100%; display: flex }
.top .sync { position: static; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 99px; background: rgba(255, 255, 255, .1); color: var(--nav-ink); box-shadow: none }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: #7fcb98; flex: none }
.sync.busy i { background: var(--gold); animation: pulse 1s ease-in-out infinite }
.sync.off { background: var(--warn) !important; color: #fff }
.sync.off i { background: #fff }
@keyframes pulse { 50% { opacity: .35 } }
.top.sub .sync-row[data-st="ok"] { display: none }
.topnav, .recbtn { display: none }

/* navy band under the header */
.band { background: var(--nav); color: var(--nav-ink); padding: 4px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); position: relative }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 24px; background: var(--bg); border-radius: 24px 24px 0 0 }
.band-in { max-width: var(--maxw); margin: 0 auto; display: grid; gap: 16px }
.band h2 { color: var(--nav-ink); font-size: 22px }
.band p { color: var(--nav-muted); font-size: 13px }
.band + .page { padding-top: 4px }
.hero-row { display: flex; align-items: center; gap: 16px }
.hero-t { display: grid; gap: 3px }
.hero-t b { font-size: 16px }
.hero-t span { color: var(--nav-muted); font-size: 13px }
.band-chip { display: inline-flex; align-items: center; gap: 8px; justify-self: start; background: rgba(255, 255, 255, .1); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 13.5px }
.band-chip svg, .nextchip svg { width: 16px; height: 16px; color: var(--gold) }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255, 255, 255, .16) 0) }
.ring-in { width: 72px; height: 72px; border-radius: 50%; background: var(--nav); display: grid; place-items: center; align-content: center; line-height: 1.1 }
.ring-in b { font-size: 20px }
.ring-in small { font-size: 10.5px; color: var(--nav-muted); font-weight: 700 }
.pb { display: flex; align-items: center; gap: 14px }
.pb-t { flex: 1; min-width: 0; display: grid; gap: 3px }
.av.ringed { border: 3px solid var(--gold); width: 60px; height: 60px }
.btn.band-btn { background: rgba(255, 255, 255, .14); border-color: transparent; color: var(--nav-ink); flex: none }
.btn.band-btn svg { width: 17px; height: 17px }
.path { display: flex; align-items: center }
.path .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: rgba(255, 255, 255, .16); color: var(--nav-ink); flex: none }
.path .dot.done { background: var(--gold); color: #243049 }
.path .dot.part { box-shadow: inset 0 0 0 2px var(--gold) }
.path .dot.cur { width: 36px; height: 36px; background: var(--flame); color: #fff; box-shadow: 0 0 0 3px #fff }
.path .ln { flex: 1; height: 3px; background: rgba(255, 255, 255, .22); min-width: 4px }
.path .ln.on { background: var(--gold) }

/* buttons */
.btn svg { width: 17px; height: 17px; flex: none }
.btn.flame { background: var(--flame); border-color: var(--flame); color: #fff }
.btn.flame:hover { filter: brightness(1.05) }
.btn.block.bigsave { min-height: 54px; border-radius: 16px; font-size: 16px; font-weight: 800 }
.btn.primary.flame { background: var(--flame); border-color: var(--flame); color: #fff }
.linkbtn { border: 0; background: none; padding: 0; font: 700 13px var(--sans); color: var(--accent); cursor: pointer; justify-self: start; text-decoration: underline; text-underline-offset: 3px }

/* sections */
.sec { display: grid; gap: 10px; min-width: 0 }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.sec-h h2 { font-size: 21px }
.lead { font-family: var(--serif); font-size: 19px; font-weight: 700 }
.warn-t { color: var(--warn); font-weight: 700 } .miss-t { color: var(--miss); font-weight: 700 }

/* "needs you today" tiles */
.ntiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.ntile { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); color: var(--ink); text-decoration: none; min-width: 0 }
a.ntile:hover { border-color: var(--accent) }
.ntile > svg { width: 28px; height: 28px; flex: none }
.ntile > span { display: grid; min-width: 0 }
.ntile b { font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums }
.ntile > span > span { font-size: 12.5px; font-weight: 700; line-height: 1.25 }
.tone-flame > svg { color: var(--flame) } .tone-info > svg { color: var(--info) } .tone-miss > svg { color: var(--miss) } .tone-warn > svg { color: var(--warn) } .tone-ok > svg { color: var(--ok) }
.ntile.hot { background: var(--flame); border-color: var(--flame); color: #fff }
.ntile.hot > svg { color: #fff }
.ntile.zero { opacity: .62 }
.ntile.zero b { color: var(--muted) }

/* the journey */
.journey { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px; display: grid }
.stage { position: relative; border-top: 1px solid var(--line) }
.stage:first-child { border-top: 0 }
.stage-h { display: grid; grid-template-columns: 34px 1fr auto 14px; gap: 12px; align-items: center; padding: 11px 4px; color: inherit; text-decoration: none }
.stage .cnt { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13.5px; background: var(--blank); color: var(--muted) }
.tone-info .cnt { background: var(--accent-soft); color: var(--info) }
.tone-flame .cnt { background: var(--flame); color: #fff }
.tone-ok .cnt { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok) }
.tone-miss .cnt { background: color-mix(in srgb, var(--miss) 14%, transparent); color: var(--miss) }
.stage-t { display: grid; gap: 1px; min-width: 0 }
.stage-t b { font-size: 15px }
.stage-t > span { font-size: 12.5px; color: var(--muted) }
.stage .go { color: var(--muted); font-size: 20px }
.stage.hot .stage-h { background: var(--flame-soft); border-radius: 14px; margin: 4px -8px; padding-inline: 12px }
.stage.hot .stage-t > span { color: color-mix(in srgb, var(--flame) 80%, var(--ink)); font-weight: 700 }
.faces .av { border-color: var(--surface) }
.stage-p { display: none }
.mini { display: flex; align-items: center; gap: 10px; padding: 9px; border-radius: 12px; border: 1px solid var(--line); color: inherit; text-decoration: none; background: var(--surface); min-width: 0 }
.mini:hover { border-color: var(--accent) }
.mini-t { display: grid; gap: 3px; min-width: 0 }
.mini-t b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mini-t > span { font-size: 11.5px; color: var(--muted); font-weight: 600 }
.more-l { font-size: 12.5px; font-weight: 700; color: var(--muted); text-decoration: none; padding-left: 4px }

/* this week */
.week { background: var(--nav); color: var(--nav-ink); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px }
.wk-l { flex-basis: 100%; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold) }
.wk { display: grid; font-size: 12px; color: var(--nav-muted); font-weight: 600 }
.wk b { font-size: 26px; color: var(--nav-ink); line-height: 1.1 }
.btn.wk-btn { margin-left: auto; background: rgba(255, 255, 255, .12); border-color: transparent; color: var(--nav-ink) }
.btn.wk-btn svg { color: var(--gold) }
.dash-2 { display: grid; gap: 16px }
.cong { display: grid; gap: 6px }

/* people */
.segs { display: flex; gap: 3px; flex: 1; min-width: 60px; max-width: 180px }
.segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--blank) }
.segs i.on { background: var(--flame) }
.prog { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted) }
.prog .track { flex: 1; max-width: 180px; height: 6px }
.person-item { border-radius: 16px; padding: 12px 14px }
.person-item.is-ready { border-color: var(--flame); background: color-mix(in srgb, var(--flame-soft) 60%, var(--surface)) }
.person-item.is-stale { box-shadow: inset 4px 0 0 var(--miss) }
.empty { justify-items: center; text-align: center; padding: 28px 18px }
.ci { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--flame-soft); color: var(--flame); flex: none }
.ci svg { width: 22px; height: 22px }
.celebrate { display: flex; gap: 14px; align-items: flex-start; border-color: var(--flame); background: var(--flame-soft) }
a.celebrate { align-items: center }
.celebrate > span:last-child { display: grid; gap: 2px }
details.edit summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--accent); padding: 4px 0 }
details.edit[open] summary { margin-bottom: 10px }
fieldset.fs { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px }
fieldset.fs legend { font-size: 12.5px; font-weight: 700; color: var(--muted) }
.cols { display: grid; gap: 16px; min-width: 0 }
.col { display: grid; gap: 14px; align-content: start; min-width: 0 }

/* record a session */
.rec { gap: 0; padding: 0; overflow: hidden }
.rec-h { padding: 16px 16px 6px; display: grid; gap: 4px }
.rec-h h2 { font-size: 20px }
.rec .err { padding: 0 16px }
.rec .bigsave { margin: 10px 16px 16px; width: calc(100% - 32px) }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line) }
.rec-h + .step { border-top: 0 }

<script>
/* ============================================================
   MBBE Discipleship Tracker — shared app logic (tracking edition)
   Lessons are taught from the printed booklet. The app records
   sessions, progress, graduation, certificates and yearly status.
   The same code runs in Google Apps Script (Sheets adapter in
   Code.gs) and in the browser demo (local adapter).
   ============================================================ */
var CORE = (function () {
  var SCHEMA = {
    Users: ['UserID', 'Name', 'Mobile', 'PinHash', 'Role', 'CongregationID', 'Status', 'DisciplerID', 'ModCongregations', 'AppointedBy', 'AppointedAt', 'FailCount', 'LockUntil', 'CreatedAt', 'LastLogin', 'Disciples', 'TakesLessons', 'IsSample'],
    Congregations: ['CongregationID', 'Name', 'Location', 'Preachers', 'Status', 'IsSample'],
    Lessons: ['LessonID', 'Level', 'LevelName', 'Order', 'Number', 'Title', 'MemoryRef', 'MemoryText', 'Published', 'UpdatedAt', 'Question'],
    Enrollments: ['EnrollmentID', 'UserID', 'ProgramYear', 'Level', 'Status', 'StartDate', 'CompletedDate', 'ExpiryDate', 'ApprovedBy', 'IsSample'],
    Sessions: ['SessionID', 'EnrollmentID', 'UserID', 'DisciplerID', 'LessonID', 'Date', 'Finished', 'Notes', 'NextMeeting', 'Confirmed', 'ConfirmedAt', 'CreatedAt', 'IsSample'],
    Certificates: ['CertNo', 'UserID', 'EnrollmentID', 'ProgramYear', 'Level', 'LevelName', 'IssuedDate', 'IssuedBy', 'ValidUntil', 'IsSample'],
    Photos: ['PhotoID', 'Kind', 'OwnerID', 'FileID', 'Thumb', 'CreatedAt', 'CreatedBy', 'IsSample'],
    AuditLog: ['Timestamp', 'UserID', 'Action', 'Target', 'Details'],
    Settings: ['Key', 'Value']
  };
  var DEFAULTS = {
    ChurchName: 'Metropolitan Bible Baptist Ekklesia',
    ProgramName: 'Discovery Lessons',
    ValidityDays: '365',
    StaleDays: '30',
    Signatory1: '', Signatory1Title: 'Senior Pastor',
    Signatory2: '', Signatory2Title: 'Coordinator',
    DiscipleLogin: 'FALSE' // disciples get picture updates from their discipler instead of signing in
  };
  var ROLES = ['Disciple', 'Discipler', 'Coordinator', 'Admin'];
  var RANK = { Disciple: 0, Discipler: 1, Coordinator: 2, Moderator: 2, Admin: 3 }; // 'Moderator' kept for older rows
  var TOKEN_DAYS = 30;
  var DAY = 864e5;

  var db; // adapter for this request

  function fail(msg) { throw new Error(msg); }
  function nowIso() { return db.now().toISOString(); }
  function str(v) { return v == null ? '' : String(v); }
  function rows(t) { return db.all(t); }
  var IDX = {};
  function idx(t, k) {
    var key = t + '|' + k;
    if (!IDX[key]) { var m = {}; rows(t).forEach(function (r) { var v = str(r[k]); (m[v] = m[v] || []).push(r); }); IDX[key] = m; }
    return IDX[key];
  }
  function find(t, k, v) { var a = idx(t, k)[str(v)]; return a ? a[0] : null; }
  function ins(t, o) { db.insert(t, o); IDX = {}; }
  function upd(t, k, v, patch) { db.update(t, k, v, patch); IDX = {}; }
  function audit(actor, action, target, details) {
    ins('AuditLog', { Timestamp: nowIso(), UserID: actor ? actor.UserID : '', Action: action, Target: target || '', Details: details || '' });
  }
  function settings() {
    var s = {}; Object.keys(DEFAULTS).forEach(function (k) { s[k] = DEFAULTS[k]; });
    rows('Settings').forEach(function (r) { if (r.Key) s[r.Key] = str(r.Value); });
    return s;
  }
  // Manila calendar date (UTC+8) as YYYY-MM-DD
  function today() { return new Date(db.now().getTime() + 8 * 36e5).toISOString().slice(0, 10); }
  function dayMs(d) { return Date.parse(str(d).slice(0, 10) + 'T00:00:00Z'); }
  function isDate(d) { return /^\d{4}-\d{2}-\d{2}$/.test(str(d)) && !isNaN(dayMs(d)); }
  function normMobile(m) {
    var d = str(m).replace(/\D/g, '');
    if (d.indexOf('63') === 0 && d.length === 12) d = '0' + d.slice(2);
    if (d.length === 10 && d[0] === '9') d = '0' + d;
    return d;
  }
  function checkPin(p) { if (!/^\d{4,6}$/.test(str(p))) fail('PIN must be 4 to 6 digits.'); }
  function hashPin(pin, salt) { salt = salt || db.uid(); return salt + '$' + db.hash(salt + ':' + pin); }
  function pinOk(pin, stored) { var s = str(stored).split('$'); return s.length === 2 && hashPin(pin, s[0]) === stored; }

  function makeToken(u) {
    var exp = db.now().getTime() + TOKEN_DAYS * DAY;
    var body = u.UserID + '.' + exp;
    return body + '.' + db.sign(body);
  }
  function auth(token) {
    var p = str(token).split('.');
    if (p.length !== 3 || db.sign(p[0] + '.' + p[1]) !== p[2] || +p[1] < db.now().getTime()) fail('AUTH: Please sign in again.');
    var u = find('Users', 'UserID', p[0]);
    if (!u || u.Status !== 'Active') fail('AUTH: Your account is not active. Ask your coordinator.');
    return u;
  }
  function need(u, role) { if (RANK[u.Role] < RANK[role]) fail('You do not have access to this.'); }
  function scope(u) {
    if (u.Role === 'Admin') return null; // all
    if (RANK[u.Role] === 2) return str(u.ModCongregations).split(',').map(function (s) { return s.trim(); }).filter(String);
    return [u.CongregationID];
  }
  function inScope(u, target) {
    if (!target) return false;

  /* ---------- small helpers ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var LS = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var S = { token: LS.get(TOKEN_KEY), me: null, info: null };
  var app = document.getElementById('app');

  function fmtDate(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function rel(iso) {
    if (!iso) return 'never';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' hr ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' days ago';
    return fmtDate(iso);
  }

  function pill(t, label) { return '<span class="pill ' + (PILL[t] || '') + '">' + esc(label || t) + '</span>'; }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function confirmTap(btn, label, fn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; fn(); return; }
      btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
      setTimeout(function () { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
    });
  }

  function remote(action, params) {

        F.map(function (x) { return '<label class="f">' + x[1] + '<input class="i" id="s-' + x[0] + '" value="' + esc(s[x[0]]) + '"' + (/Days$/.test(x[0]) ? ' inputmode="numeric"' : '') + '></label>'; }).join('') +
        '<p class="small muted">Signatory 1 is usually the senior pastor; their photo and name open the graduation presentation. If signatory 2 is blank, the certificate shows the coordinator who issued it.</p><button class="btn primary">Save settings</button></form>' +
        '<div class="card preacher">' + avatar((runLocal('preacherPhotos').data || { photos: {} }).photos['SIG|1'], 'lg', '') + '<b>Signatory 1 photo<span class="small muted" style="display:block;font-weight:500">Shown on the opening slide of the presentation</span></b><button type="button" class="btn sm" id="sigph">' + icon('camera') + 'Choose photo</button></div>');
      $('#sigph').onclick = function () { pickImage(true, function (pic) { uploadPhoto('preacher', 'SIG|1', pic).then(function () { viewSettings(); }).catch(function (x) { toast(x.message); }); }); };
      $('#f').onsubmit = function (e) { e.preventDefault(); var q = { DiscipleLogin: $('#s-dl').checked ? 'TRUE' : 'FALSE' }; F.forEach(function (x) { q[x[0]] = $('#s-' + x[0]).value; }); api('saveSettings', q).then(function () { S.me.settings.DiscipleLogin = q.DiscipleLogin; LS.del('dt-info'); toast('Settings saved.'); S.info = null; }).catch(function (x) { toast(x.message); }); };
    });
  }

  /* ---------- profile ---------- */
  function switchRow(id, label, sub, on) { return '<label class="switch"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span class="sw" aria-hidden="true"></span><span><b>' + label + '</b><span class="small muted">' + sub + '</span></span></label>'; }
  function viewProfile() {
    frame({ title: 'Profile', section: rank() >= 2 ? 'more' : 'profile', back: rank() >= 2 ? '#/more' : null });
    var u = S.me.user;
    var m = fill('<div class="card profile-card">' + avatar(u.PhotoID, 'xl', 'Your photo') + '<div><h2>' + esc(u.Name) + '</h2><p class="small muted">' + esc(u.Role) + ' · ' + esc(S.me.congregation) + ' · ' + esc(u.Mobile) + '</p>' +
        '<div class="row"><button type="button" class="btn sm" id="ph">' + (u.PhotoID ? 'Change photo' : 'Add a photo') + '</button>' + (u.PhotoID ? '<button type="button" class="btn quiet sm" id="phx">Remove</button>' : '') + '</div></div></div>' +
      (u.Role === 'Discipler' ? '<div class="card stack"><h3>Your options</h3>' + switchRow('opt-l', 'I’m being discipled this year', 'Shows “My progress” and lets your coordinator assign you a discipler.', u.TakesLessons) + '</div>' : '') +
      (u.Role === 'Coordinator' ? '<div class="card stack"><h3>Your options</h3>' +
        switchRow('opt-d', 'I also disciple people', 'Shows “My disciples” and lists you as a discipler.', u.Disciples) +
        switchRow('opt-l', 'I’m taking the lessons this year', 'Shows “My progress” and “My certificates”.', u.TakesLessons) + '</div>' : '') +
      '<form class="card" id="f"><h3>Change PIN</h3><label class="f">Current PIN<input class="i" id="op" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>' +
      '<label class="f">New PIN<input class="i" id="np" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><button class="btn">Change PIN</button></form>' +
      (!DEMO_MODE && SNAP ? '<p class="small muted">Data last updated ' + esc(rel(SNAP.at)) + (OUTBOX.length ? ' · ' + OUTBOX.length + ' change(s) waiting to be sent' : '') + '. <button type="button" class="btn quiet sm" id="refresh">Refresh now</button></p>' : '') +
      installCard() + '<button type="button" class="btn" id="out">Sign out</button>' +
      (DEMO_MODE ? '<div class="demo"><div><b>Demo mode.</b> Reset brings back the original sample people and progress.</div><div><button type="button" class="btn sm" id="reset">Reset demo data</button></div></div>' : ''));
    wireInstall();
    $('#ph', m).onclick = function () { pickImage(true, function (pic) { uploadPhoto('person', u.UserID, pic).then(function () { viewProfile(); }).catch(function (x) { toast(x.message); }); }); };
    var px = $('#phx', m); if (px) confirmTap(px, 'Tap again to remove', function () { deletePhoto(u.PhotoID).then(viewProfile).catch(function (x) { toast(x.message); }); });
    ['opt-d', 'opt-l'].forEach(function (id) { var el = $('#' + id, m); if (el) el.onchange = function () {
      var q = id === 'opt-d' ? { disciples: el.checked } : { takesLessons: el.checked };
      if (id === 'opt-d' && !el.checked && !confirm2(el)) return;
      api('setOptions', q).then(function (r) { if (r && r.user) S.me.user = Object.assign(S.me.user, r.user); var me2 = runLocal('me'); if (me2.ok) S.me = me2.data; toast('Saved.'); setTimeout(viewProfile, 300); }).catch(function (x) { toast(x.message); el.checked = !el.checked; });
    }; });
    $('#f').onsubmit = function (e) { e.preventDefault(); remote('changePin', { oldPin: $('#op').value, newPin: $('#np').value }).then(function () { toast('PIN changed.'); $('#f').reset(); }).catch(function (x) { toast(x.message); }); };
    var rf = $('#refresh', m); if (rf) rf.onclick = function () { busy(rf, true); flush(); pull().then(function () { toast('Up to date.'); viewProfile(); }).catch(function (x) { toast(x.message); busy(rf, false); }); };
    $('#out').onclick = signOut;
    var r = $('#reset', m); if (r) confirmTap(r, 'Tap again to reset', function () { DEMO.reset(); signOut(); toast('Demo data reset.'); });
  }
  // Turning off "I also disciple people" releases your disciples; make sure that's intended.
  function confirm2(el) {
    if (el.dataset.ok) { delete el.dataset.ok; return true; }
    el.checked = true; el.dataset.ok = '1';
    toast('Your disciples will need a new discipler. Tap the switch again to confirm.');
    setTimeout(function () { delete el.dataset.ok; }, 4000);
    return false;
  }

  /* ---------- add to home screen ---------- */
  var INSTALL = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); INSTALL = e; var c = $('.install'); if (c) { c.outerHTML = installCard(); wireInstall(); } });
  if (!IS_ARTIFACT && 'serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function installCard() {
    if (IS_ARTIFACT || standalone()) return '';
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (/macintosh/i.test(navigator.userAgent) && 'ontouchend' in document);
    return '<div class="card install"><span class="ci">' + icon('download') + '</span><div class="stack"><b>Add the app to your home screen</b><span class="small muted">It opens full screen like a regular app, without the browser bar.</span>' +
      (INSTALL ? '<div><button type="button" class="btn flame sm" id="inst">' + icon('download') + 'Install app</button></div>'
        : '<span class="small">' + (ios ? 'In <b>Safari</b>, tap the Share button <b>⬆</b>, then <b>Add to Home Screen</b>.' : 'In <b>Chrome</b>, tap the menu <b>⋮</b>, then <b>Add to Home screen</b> or <b>Install app</b>.') + '</span>') + '</div></div>';
  }
  function wireInstall() {
    var b = $('#inst'); if (!b) return;
    b.onclick = function () { if (!INSTALL) return; INSTALL.prompt(); INSTALL.userChoice.then(function (ch) { INSTALL = null; var c = $('.install'); if (c && ch && ch.outcome === 'accepted') c.remove(); }); };
  }

  /* ---------- router ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent), v = parts[0];
    if (!S.token) { return v === 'register' ? viewRegister() : viewLogin(); }
    if (!S.me) {
      if (DEMO_MODE) { var dm = runLocal('me'); if (dm.ok) { S.me = dm.data; return route(); } return signOut(); }
      if (loadStored()) { lastPull = 0; flush(); pull().catch(function () {}); return route(); }
      app.innerHTML = '<div class="auth"><div class="auth-in">' + loadingHTML() + '</div></div>';
      return pull().then(function () { route(); }).catch(function (e) { if (!e.auth) authShell('<div class="card"><p class="err">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>'); });
    }
    VIEW = null;
    var R = rank();
    var routes = {
      '': function () { location.replace('#/' + homeRoute()); },
      login: function () { location.replace('#/' + homeRoute()); },
      register: function () { location.replace('#/' + homeRoute()); },
      home: viewHome, certs: viewMyCerts, cert: function () { viewCert(parts[1]); }, profile: viewProfile,
      disciples: R >= 1 && mine().disciples && viewDisciples, person: R >= 1 && function () { viewPerson(parts[1], parts[2] === 'record'); }, record: R >= 1 && mine().disciples && viewRecordPick,
      dash: R >= 2 && viewDash, people: R >= 2 && function () { viewPeople(parts[1]); }, reports: R >= 2 && function () { viewReports(parts[1], parts[2]); },
      certadmin: R >= 2 && viewCertAdmin, present: R >= 2 && viewPresent, more: R >= 2 && viewMore, audit: R >= 2 && viewAudit,
      setup: R >= 3 && function () { ({ congregations: viewCongs, lessons: viewLessonsAdmin, lesson: function () { viewLessonEdit(parts[2]); }, settings: viewSettings, sample: viewSample }[parts[1]] || viewMore)(); }
    };
    (routes[v] || function () { location.replace('#/' + homeRoute()); })();
  }

  /* ---------- global events ---------- */
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go;
  });
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
